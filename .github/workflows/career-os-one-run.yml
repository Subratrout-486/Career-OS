name: Career OS — One Run Conductor Boundary

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/career_os/agent_harness.py'
      - 'src/career_os/pipeline_harness.py'
      - 'src/career_os/agent_runtime.py'
      - 'src/career_os/orchestrator.py'
      - 'src/career_os/agents.py'
      - 'src/career_os/conductor_runtime.py'
      - 'src/career_os/pipeline_adapter.py'
      - 'scripts/run_harness_smoke.py'
      - 'scripts/run_conductor_boundary_smoke.py'
      - 'scripts/run_conductor_e2e.py'
      - 'tests/test_agent_harness.py'
      - 'tests/test_agent_structured_retry.py'
      - 'tests/test_pipeline_harness.py'
      - 'tests/test_conductor_runtime.py'
      - 'tests/fixtures/harness-smoke-job.json'
      - 'tests/fixtures/conductor-e2e-job.json'
      - '.github/workflows/career-os-one-run.yml'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  # Career OS does not call model APIs directly. Conductor/AgentFlow is the
  # AI runtime boundary; its server-side provider credentials stay there.
  AI_PROVIDER: conductor
  ATS_INDEPENDENT_PASS_THRESHOLD: '60'

jobs:
  one-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Career OS
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio httpx

      - name: Harness and Conductor contract tests
        run: |
          python -m pytest -q \
            tests/test_agent_harness.py \
            tests/test_agent_structured_retry.py \
            tests/test_pipeline_harness.py \
            tests/test_conductor_runtime.py

      - name: Create durable Conductor handoff
        env:
          CONDUCTOR_BASE_URL: ${{ vars.CONDUCTOR_BASE_URL || 'https://agentflow-cthh8upg.manus.space' }}
        run: |
          set -euo pipefail
          python scripts/run_conductor_boundary_smoke.py \
            --job-json tests/fixtures/harness-smoke-job.json \
            --profile config/master_profile.md \
            --result-output conductor-handoff.json \
            --control-plane conductor-handoff-control-plane.json

      - name: Assert handoff is durable and fail-closed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('conductor-handoff.json').read_text())
          assert result['status'] == 'READY_FOR_CONDUCTOR', result
          assert result['paid_provider_fallback'] is False, result
          assert result['source_of_truth'] == 'Career Profile / Master Resume + Career Evidence Vault', result
          assert len(result['next_stages']) >= 8, result
          print('CONDUCTOR_HANDOFF_READY')
          print('TASK_ID=' + result['task_id'])
          PY

      - name: Run real Career OS → Conductor → AI pipeline
        if: ${{ secrets.CONDUCTOR_BRIDGE_TOKEN != '' }}
        env:
          CONDUCTOR_MCP_URL: ${{ vars.CONDUCTOR_MCP_URL || 'https://agentflow-cthh8upg.manus.space/api/conductor/mcp' }}
          CONDUCTOR_BRIDGE_TOKEN: ${{ secrets.CONDUCTOR_BRIDGE_TOKEN }}
          CONDUCTOR_TIMEOUT_SECONDS: '600'
          CONDUCTOR_POLL_SECONDS: '3'
          AI_PROVIDER: conductor
        run: |
          set -euo pipefail
          python scripts/run_conductor_e2e.py \
            --job-json tests/fixtures/conductor-e2e-job.json \
            --profile config/master_profile.md \
            --result-output conductor-e2e-result.json

      - name: Explain why live E2E was skipped
        if: ${{ secrets.CONDUCTOR_BRIDGE_TOKEN == '' }}
        run: |
          echo 'LIVE_CONDUCTOR_E2E_SKIPPED: CONDUCTOR_BRIDGE_TOKEN is not configured in GitHub Actions.'
          echo 'Contract tests and the durable handoff still ran; no paid-provider fallback is permitted.'

      - name: Publish one-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: career-os-conductor-boundary-${{ github.run_id }}
          path: |
            conductor-handoff.json
            conductor-handoff-control-plane.json
            conductor-e2e-result.json
          if-no-files-found: warn
          retention-days: 14
