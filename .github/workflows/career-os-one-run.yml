name: Career OS — One Run Provider Boundary

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  ATS_INDEPENDENT_PASS_THRESHOLD: '60'
  AI_PROVIDER: ${{ vars.AI_PROVIDER || 'auto' }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
  XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
  MANUS_MODEL: ${{ vars.MANUS_MODEL || 'gpt-5-mini' }}

jobs:
  one-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Career OS
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio httpx

      - name: Harness and provider contract tests
        run: |
          python -m pytest -q \
            tests/test_agent_harness.py \
            tests/test_agent_runtime_continuation.py \
            tests/test_direct_provider_runtime.py \
            tests/test_pipeline_harness.py

      - name: Verify provider boundary
        run: |
          set -euo pipefail
          if [ "$AI_PROVIDER" = "auto" ]; then
            echo 'AI_PROVIDER_SMOKE_SKIPPED: Pin AI_PROVIDER to a direct provider before enabling live model execution.'
            echo 'Supported direct providers: manus, gemini, xai, deepseek, anthropic.'
            exit 0
          fi
          case "$AI_PROVIDER" in
            manus|gemini|xai|deepseek|anthropic)
              python scripts/run_ai_provider_smoke.py
              ;;
            *)
              echo "Unsupported AI_PROVIDER=$AI_PROVIDER"
              exit 1
              ;;
          esac

      - name: Run full Career OS pipeline through the selected provider
        if: env.AI_PROVIDER != 'auto'
        run: |
          set -euo pipefail
          python scripts/run_direct_provider_e2e.py \
            --job-json tests/fixtures/conductor-e2e-job.json \
            --profile config/master_profile.md \
            --offline-vault \
            --result-output direct-provider-e2e-result.json

      - name: Create durable provider-neutral handoff evidence
        run: |
          python scripts/run_provider_boundary_smoke.py \
            --job-json tests/fixtures/harness-smoke-job.json \
            --profile config/master_profile.md \
            --result-output provider-boundary-handoff.json \
            --control-plane provider-boundary-control-plane.json

      - name: Assert handoff remains provider-neutral
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          result = json.loads(Path('provider-boundary-handoff.json').read_text())
          assert result['status'] == 'READY_FOR_AI_PROVIDER', result
          assert result['paid_provider_fallback'] is False, result
          assert result['source_of_truth'] == 'Career Profile / Master Resume + Career Evidence Vault', result
          assert len(result['next_stages']) >= 8, result
          print('DURABLE_HANDOFF_READY')
          print('TASK_ID=' + result['task_id'])
          print('PROVIDER_BOUNDARY=' + ('DIRECT_PROVIDER' if os.environ['AI_PROVIDER'] != 'auto' else 'UNCONFIGURED'))
          PY

      - name: Publish one-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: career-os-provider-boundary-${{ github.run_id }}
          path: |
            provider-boundary-handoff.json
            provider-boundary-control-plane.json
            direct-provider-e2e-result.json
          if-no-files-found: warn
          retention-days: 14
