name: Career OS — Specialist Source Intake (Stage 1 only)

on:
  workflow_dispatch:
    inputs:
      source:
        description: Authorized source capture to normalize
        required: true
        type: choice
        options:
          - jobright
          - simplify
      input_path:
        description: Repository path to an authorized JSON export/browser capture
        required: true
        default: jobs/specialist_source_inbox/jobs.json
      intake_method:
        description: How the authorized capture was obtained
        required: true
        type: choice
        default: authorized_browser_capture
        options:
          - authorized_browser_capture
          - authorized_json_export

permissions:
  contents: read
  issues: write

concurrency:
  group: career-os-specialist-source-intake
  cancel-in-progress: false

jobs:
  intake-only:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Career OS
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Normalize authorized source capture
        run: |
          set -euo pipefail
          test -f "${{ inputs.input_path }}"
          python scripts/import_specialist_jobs.py \
            --source "${{ inputs.source }}" \
            --input "${{ inputs.input_path }}" \
            --intake-method "${{ inputs.intake_method }}" \
            --output-dir jobs/discovery_runtime \
            --report specialist-source-intake-report.json \
            --paths-output specialist-source-intake-paths.txt

      - name: Validate specialist Stage 1 records
        if: ${{ hashFiles('specialist-source-intake-paths.txt') != '' }}
        run: |
          set -euo pipefail
          python scripts/intake_contract.py --paths specialist-source-intake-paths.txt --report specialist-intake-contract-report.json

      - name: Publish specialist Stage 1 evidence only
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: career-os-specialist-stage1-${{ github.run_id }}
          path: |
            specialist-source-intake-report.json
            specialist-source-intake-paths.txt
            specialist-intake-contract-report.json
            jobs/discovery_runtime/
          if-no-files-found: warn
          retention-days: 14

      - name: Stage 1 hard boundary
        run: |
          echo 'STAGE_1_SPECIALIST_INTAKE_COMPLETE'
          echo 'BLOCKED: JD enrichment, matching, resume generation, Notion processing, and browser execution.'
