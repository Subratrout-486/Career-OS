name: Career OS — Gmail Job Intake (Stage 1 only)

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: career-os-gmail-intake
  cancel-in-progress: true

jobs:
  gmail-intake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Ingest Gmail job alerts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_QUERY: ${{ vars.GMAIL_QUERY || 'newer_than:7d (job OR jobs OR career OR opportunity OR hiring OR support)' }}
          MAX_NEW_EMAIL_JOBS: '10'
          GMAIL_PAGE_SIZE: '100'
          GMAIL_MAX_PAGES: '10'
        run: python scripts/gmail_job_intake_runner.py

      - name: Validate Gmail Stage 1 contract
        run: |
          set -euo pipefail
          if [ ! -f gmail_discovered_paths.txt ]; then
            printf 'discovered=0\n' > intake-summary.txt
            echo 'No Gmail intake output was produced; valid empty intake.'
            exit 0
          fi
          python scripts/intake_contract.py --paths gmail_discovered_paths.txt --report gmail-intake-contract-report.json
          discovered="$(grep -cve '^$' gmail_discovered_paths.txt || true)"
          printf 'discovered=%s\n' "$discovered" > intake-summary.txt
          echo "Gmail Stage 1 discovered and validated ${discovered} candidate records."

      - name: Publish Gmail Stage 1 evidence only
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: career-os-gmail-stage1-${{ github.run_id }}
          path: |
            gmail_discovered_paths.txt
            intake-summary.txt
            gmail-intake-contract-report.json
            jobs/discovery_runtime/
          if-no-files-found: warn
          retention-days: 14

      - name: Stage 1 hard boundary
        run: |
          echo 'STAGE_1_GMAIL_INTAKE_COMPLETE'
          echo 'BLOCKED: JD enrichment, matching, resume generation, Notion processing, and browser execution.'
