name: Career OS — Gmail Job Intake (Stage 1 only)

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: career-os-gmail-intake
  cancel-in-progress: true

jobs:
  gmail-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Verify Stage 1 Python package
        run: |
          set -euo pipefail
          python -c "import scripts; import scripts.gmail_job_intake_runner; print('STAGE1_IMPORT_OK')"

      - name: Ingest Gmail job alerts
        id: ingest
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_QUERY: ${{ vars.GMAIL_QUERY || 'newer_than:7d (job OR jobs OR career OR opportunity OR hiring OR support)' }}
          MAX_NEW_EMAIL_JOBS: '1'
          GMAIL_PAGE_SIZE: '25'
          GMAIL_MAX_PAGES: '1'
        run: python -m scripts.gmail_job_intake_runner

      - name: Record Gmail runtime status
        if: ${{ always() }}
        run: |
          if [ "${{ steps.ingest.outcome }}" = "success" ]; then
            echo 'GMAIL_RUNTIME=OK' > intake-runtime-status.txt
          else
            echo 'GMAIL_RUNTIME=BLOCKED_OR_FAILED' > intake-runtime-status.txt
            echo 'Gmail ingestion did not complete; Stage 1 remains isolated and no downstream stage will run.' >> intake-runtime-status.txt
          fi

      - name: Validate Gmail Stage 1 contract
        if: ${{ steps.ingest.outcome == 'success' }}
        run: |
          set -euo pipefail
          if [ ! -f gmail_discovered_paths.txt ]; then
            printf 'discovered=0\n' > intake-summary.txt
            echo 'No Gmail intake output was produced; valid empty intake.'
            exit 0
          fi
          python scripts/intake_contract.py --paths gmail_discovered_paths.txt --report gmail-intake-contract-report.json
          discovered="$(grep -cve '^$' gmail_discovered_paths.txt || true)"
          printf 'discovered=%s\n' "$discovered" > intake-summary.txt
          echo "Gmail Stage 1 discovered and validated ${discovered} candidate records."

      - name: Publish Gmail Stage 1 evidence only
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: career-os-gmail-stage1-${{ github.run_id }}
          path: |
            gmail_discovered_paths.txt
            gmail_intake_rejected.json
            intake-summary.txt
            intake-runtime-status.txt
            gmail-intake-contract-report.json
            jobs/email_runtime/
            jobs/discovery_runtime/
          if-no-files-found: warn
          retention-days: 14

      - name: Persist validated Stage 1 records
        if: ${{ steps.ingest.outcome == 'success' }}
        run: |
          set -euo pipefail
          git config user.name 'career-os-bot'
          git config user.email '41898282+github-actions[bot]@github.com'
          mkdir -p jobs/email_runtime jobs/discovery_runtime
          git add jobs/email_runtime jobs/discovery_runtime
          if git diff --cached --quiet; then
            echo 'No new Stage 1 records to persist.'
          else
            git commit -m 'chore: persist Stage 1 Gmail intake records'
            git push
          fi

      - name: Stage 1 hard boundary
        run: |
          echo 'STAGE_1_GMAIL_INTAKE_COMPLETE'
          echo 'INTAKED records persisted in the canonical jobs store.'
          echo 'Downstream stages remain blocked by design.'
