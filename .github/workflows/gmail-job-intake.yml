name: Career OS — Gmail Job Intake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gmail-job-intake.yml'
      - 'scripts/gmail_job_intake.py'
      - 'scripts/gmail_job_intake_runner.py'
      - 'scripts/prepare_gmail_issue_pipeline.py'

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: career-os-gmail-intake
  cancel-in-progress: true

jobs:
  gmail-intake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Ingest Gmail job alerts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_QUERY: ${{ vars.GMAIL_QUERY || 'newer_than:7d (job OR jobs OR career OR opportunity OR hiring OR support)' }}
          MAX_NEW_EMAIL_JOBS: '25'
          GMAIL_PAGE_SIZE: '100'
          GMAIL_MAX_PAGES: '10'
        run: python scripts/gmail_job_intake_runner.py

      - name: Build persistent Gmail intake candidates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_GMAIL_PIPELINE_JOBS: '25'
        run: python scripts/prepare_gmail_issue_pipeline.py

      - name: Validate Gmail intake output
        run: |
          set -euo pipefail
          if [ ! -f gmail_discovered_paths.txt ]; then
            printf 'discovered=0\n' > gmail-intake-summary.txt
            echo 'No Gmail candidates were produced; treating this as a valid empty intake.'
            exit 0
          fi
          discovered="$(grep -cve '^$' gmail_discovered_paths.txt || true)"
          printf 'discovered=%s\n' "$discovered" > gmail-intake-summary.txt
          echo "Career OS Gmail intake discovered ${discovered} candidate job records."
          if [ "$discovered" -gt 0 ]; then
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              test -f "$path"
            done < gmail_discovered_paths.txt
          fi

      - name: Publish Gmail intake candidates only
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: career-os-gmail-intake-candidates
          path: |
            gmail_discovered_paths.txt
            gmail_discovered_issue_numbers.txt
            gmail-intake-summary.txt
            jobs/gmail_inbox/
          if-no-files-found: warn
          retention-days: 14

      - name: Intake stage boundary
        run: |
          echo 'STAGE_1_GMAIL_INTAKE_COMPLETE'
          echo 'Downstream matching/resume/Notion/browser execution is intentionally not started in this stage.'
