name: Career OS — Self Heal

# Manual-only repair. Production failures are observed by the stage-specific
# alarm workflows; they must never cascade into an autonomous repair loop.
# This workflow remains available for an explicit, human-approved repair run.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Failed GitHub Actions run ID to diagnose"
        required: true
        type: string
      workflow_name:
        description: "Failed workflow name"
        required: true
        type: string
      head_sha:
        description: "Failed run head SHA"
        required: true
        type: string

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: career-os-self-heal-manual
  cancel-in-progress: false

jobs:
  self-heal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio httpx

      - name: Diagnose and propose bounded repair
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
        run: |
          set -euo pipefail
          python scripts/self_heal.py \
            --owner "${{ github.repository_owner }}" \
            --repo "${{ github.event.repository.name }}" \
            --run-id "${{ inputs.run_id }}" \
            --workflow-name "${{ inputs.workflow_name }}" \
            --head-sha "${{ inputs.head_sha }}" \
            --repo-root . \
            --out /tmp/self_heal_result.json
          cat /tmp/self_heal_result.json

      - name: Validate only
        run: |
          set -euo pipefail
          python -m compileall -q src
          python -m pytest tests/ -q --tb=short

      - name: Publish diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: career-os-manual-self-heal-${{ github.run_id }}
          path: /tmp/self_heal_result.json
          if-no-files-found: warn
          retention-days: 14

      - name: Safety boundary
        run: |
          echo "MANUAL_SELF_HEAL_COMPLETE"
          echo "No automatic repair, push, or workflow rerun is performed."
          echo "Use the stage-specific alarm and explicit human approval for any repair."
