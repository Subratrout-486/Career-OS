name: Repair stale truth policy

on:
  push:
    branches: [fix/evidence-truth-policy]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor == 'Subratrout-486'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch stale truth rules
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/career_os/agents.py')
          text = path.read_text()

          old = '''- IGT group-reservations/backend-operations evidence is confirmed. Previously disputed IGT technical claims such as Python, SQL,
  Power Query, Power BI, REST API testing, and UAT remain Needs-Confirmation/Unconfirmed unless the current evidence pack explicitly
  marks them confirmed. Do not promote them because an old resume or target JD mentions them.
- HARD IGT RESUME PROHIBITION: Until the user explicitly confirms a change to the source-of-truth policy, never place Python,
  SQL, Power Query, Power BI, REST API testing, UAT, or Excel under IGT Solutions in the summary, skills, or experience bullets,
  even if those terms appear in MASTER_PROFILE, a historical resume, or the target JD. Keep those IGT claims out of the resume and
  list them only as unsupported/confirmation items when relevant. Salesforce operational/work-management use may be used only when
  the approved evidence pack maps it to IGT; do not infer Salesforce administration or development.
- Excel/Advanced Excel is unconfirmed unless the current evidence pack contains employer-specific confirmed evidence; do not add it
  as professional experience or attribute it to IGT.
'''

          new = '''- IGT group-reservations/backend-operations evidence is confirmed. Employer/tool status MUST be resolved from the
  current MASTER_PROFILE plus approved evidence pack. A current evidence record marked Professional-Confirmed/Confirmed-by-User or
  Confirmed-by-Document overrides stale denylist assumptions or historical resume exclusions.
- The current canonical resume explicitly confirms Python, SQL, Power Query, Power BI, REST API testing, and UAT under IGT Solutions.
  When the evidence pack supplies those records as confirmed, they may be used under IGT in Summary, Skills, or Experience where the
  JD makes them relevant, using only the safe wording supplied by the evidence. Do not inflate the scope beyond that wording.
- Microsoft Excel is also professionally confirmed for IGT and FactSet in the current evidence pack. It may be used under the correct
  employer when relevant, but do not infer VBA/macros/Power Pivot/advanced financial modeling unless separately evidenced.
- Salesforce operational/work-management use may be used only when the approved evidence pack maps it to IGT; do not infer Salesforce
  administration or development.
'''

          if old not in text:
              raise SystemExit('Expected stale IGT truth-policy block was not found; refusing a partial repair.')
          text = text.replace(old, new, 1)

          old2 = '''- Excel/Advanced Excel is unconfirmed: surface as a gap/confirmation request, not a fabricated match, and do not auto-reject solely for Excel.'''
          new2 = '''- Excel/Advanced Excel is confirmed only to the scope represented in the approved evidence pack; do not fabricate advanced Excel features.'''
          if old2 not in text:
              raise SystemExit('Expected stale Excel fit-rule line was not found.')
          text = text.replace(old2, new2, 1)

          old3 = '''9. Do not put Excel/Advanced Excel on the resume as professional experience until employer-specific confirmation exists.
10. Years-of-experience mismatch may be surfaced as a risk but never fabricated around.
11. evidence_trace should briefly map important tailored claims to the relevant employer/source evidence.
12. Treat the HARD IGT RESUME PROHIBITION above as an output constraint, not a suggestion; if the target JD requests a denied IGT
    tool, omit it from IGT history and record it as unsupported rather than copying it into Skills or Summary.
'''
          new3 = '''9. Use professionally confirmed Excel only at the employer(s) mapped in the approved evidence pack and only within the confirmed scope.
10. Years-of-experience mismatch may be surfaced as a risk but never fabricated around.
11. evidence_trace should briefly map important tailored claims to the relevant employer/source evidence.
12. Never apply a stale employer/tool denylist when the current canonical resume and approved evidence pack explicitly confirm the
    employer/tool association. The evidence pack is the controlling employer-mapping layer for tailored output.
'''
          if old3 not in text:
              raise SystemExit('Expected stale resume-rule block was not found.')
          text = text.replace(old3, new3, 1)

          old4 = '''tools appear under the correct employer's Experience section when relevant. Verify that UNCONFIRMED tools (including Excel)
were not added.'''
          new4 = '''tools appear under the correct employer's Experience section when relevant. Verify that UNCONFIRMED tools were not added
and that confirmed tools are used only within the safe wording/scope in the evidence pack.'''
          if old4 not in text:
              raise SystemExit('Expected stale challenger rule was not found.')
          text = text.replace(old4, new4, 1)

          path.write_text(text)
          print('Truth policy repaired.')
          PY

      - name: Add regression test
        run: |
          cat > tests/test_truth_policy.py <<'PY'
          from career_os.agents import TRUTH_RULES, FIT_PROMPT, RESUME_PROMPT, CHALLENGE_PROMPT

          def test_current_evidence_controls_igt_mapping():
              assert 'current canonical resume explicitly confirms Python, SQL, Power Query, Power BI, REST API testing, and UAT under IGT Solutions' in TRUTH_RULES
              assert 'HARD IGT RESUME PROHIBITION' not in TRUTH_RULES
              assert 'previously disputed IGT technical claims' not in TRUTH_RULES

          def test_excel_is_not_globally_denied():
              assert 'Excel/Advanced Excel is unconfirmed' not in FIT_PROMPT
              assert 'Do not put Excel/Advanced Excel on the resume as professional experience until employer-specific confirmation exists.' not in RESUME_PROMPT
              assert 'UNCONFIRMED tools (including Excel)' not in CHALLENGE_PROMPT

          def test_policy_requires_evidence_scoped_wording():
              assert 'safe wording supplied by the evidence' in TRUTH_RULES
              assert 'do not fabricate advanced Excel features' in FIT_PROMPT
          PY

      - name: Run truth-policy tests
        run: |
          python -m pip install -e .
          python -m pytest -q tests/test_truth_policy.py

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/career_os/agents.py tests/test_truth_policy.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix: align truth policy with canonical evidence'
          git push origin HEAD:fix/evidence-truth-policy
