name: Career OS asynchronous pipeline

on:
  workflow_dispatch:
    inputs:
      conductor_run_id:
        description: "Opaque Conductor run identifier"
        required: true
      encrypted_job_envelope:
        description: "Authenticated encrypted job envelope; ciphertext only"
        required: true
      protocol_version:
        description: "Boundary protocol version"
        required: false
        default: "v1"

permissions:
  contents: read
  actions: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Decrypt encrypted job envelope inside runner
        id: envelope
        continue-on-error: true
        env:
          CONDUCTOR_RUN_ID: ${{ github.event.inputs.conductor_run_id }}
          ENCRYPTED_JOB_ENVELOPE: ${{ github.event.inputs.encrypted_job_envelope }}
          CAREER_OS_ENVELOPE_PRIVATE_KEY: ${{ secrets.CAREER_OS_ENVELOPE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          python scripts/decrypt_job_envelope.py "$ENCRYPTED_JOB_ENVELOPE" job-envelope.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("job-envelope.json").read_text())
          Path("job.json").write_text(json.dumps(data["job"], ensure_ascii=False))
          Path("profile.txt").write_text(str(data["profile"]))
          if data.get("applicationUrl"):
              Path("application-url.txt").write_text(str(data["applicationUrl"]))
          PY

      - name: Record explicit envelope failure
        if: always()
        run: |
          if [ "${{ steps.envelope.outcome }}" != "success" ]; then
            printf '%s\n' '{"quality_status":"FAILED","error_code":"ENVELOPE_DECRYPTION_FAILED","artifact_protocol":"career-os-pipeline-result-v1"}' > pipeline-result.raw.json
          fi

      - name: Run existing Career OS orchestrator
        id: orchestrator
        if: steps.envelope.outcome == 'success'
        continue-on-error: true
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'auto' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MODEL: ${{ vars.GITHUB_MODEL || 'openai/gpt-4.1-mini' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4-flash' }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_MODEL: ${{ vars.XAI_MODEL || 'grok-4.6' }}
          GROK_MODEL: ${{ vars.GROK_MODEL || 'grok-4.6' }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_REVIEW_QUEUE_PAGE_ID: ${{ secrets.NOTION_REVIEW_QUEUE_PAGE_ID }}
          NOTION_JOBS_DATA_SOURCE_ID: ${{ vars.NOTION_JOBS_DATA_SOURCE_ID || '3ab8bc1d-ce0e-808c-93c3-000b43141dec' }}
          NOTION_RESUME_LIBRARY_DATA_SOURCE_ID: ${{ vars.NOTION_RESUME_LIBRARY_DATA_SOURCE_ID || '3ac8bc1d-ce0e-8051-a553-000bb5f58abe' }}
          NOTION_EVIDENCE_VAULT_DATA_SOURCE_ID: ${{ vars.NOTION_EVIDENCE_VAULT_DATA_SOURCE_ID || 'eb8a5be7-990e-47d3-9b36-c922ff0bb3aa' }}
          NOTION_APPLICATIONS_DATA_SOURCE_ID: ${{ vars.NOTION_APPLICATIONS_DATA_SOURCE_ID || 'a6925702-0d2a-4d68-919b-3401e1d8ff75' }}
        run: |
          set -euo pipefail
          python scripts/gemini_preflight.py
          python -m career_os.orchestrator --profile profile.txt --job-json job.json --no-notion-write --result-output pipeline-result.raw.json

      - name: Create failure result when orchestrator did not produce output
        if: always()
        run: |
          if [ ! -s pipeline-result.raw.json ]; then
            printf '%s\n' '{"quality_status":"FAILED","error_code":"ORCHESTRATOR_FAILED_OR_NO_RESULT"}' > pipeline-result.raw.json
          fi

      - name: Sanitize result
        if: always()
        run: python scripts/sanitize_pipeline_result.py pipeline-result.raw.json pipeline-result.json

      - name: Upload private sanitized result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-result
          path: pipeline-result.json
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: false

      - name: Remove temporary envelope files
        if: always()
        run: rm -f job-envelope.json job.json profile.txt application-url.txt pipeline-result.raw.json pipeline-result.json
