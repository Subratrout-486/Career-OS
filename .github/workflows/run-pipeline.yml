name: Run Career OS Pipeline

on:
  workflow_dispatch:
    inputs:
      job_path:
        description: "Path to job JSON under jobs/"
        required: true
        default: "jobs/example.json"
      browser_context_path:
        description: "Optional verified browser-context JSON path under the workspace"
        required: false
        default: ""
  repository_dispatch:
    types: [career-os-job]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run pipeline
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'auto' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MODEL: ${{ vars.GITHUB_MODEL || 'openai/gpt-4.1-mini' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4-flash' }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_MODEL: ${{ vars.XAI_MODEL || 'grok-4.6' }}
          GROK_MODEL: ${{ vars.GROK_MODEL || 'grok-4.6' }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_REVIEW_QUEUE_PAGE_ID: ${{ secrets.NOTION_REVIEW_QUEUE_PAGE_ID }}
          NOTION_RESUME_LIBRARY_DATA_SOURCE_ID: ${{ vars.NOTION_RESUME_LIBRARY_DATA_SOURCE_ID || '3ac8bc1d-ce0e-8051-a553-000bb5f58abe' }}
          NOTION_EVIDENCE_VAULT_DATA_SOURCE_ID: ${{ vars.NOTION_EVIDENCE_VAULT_DATA_SOURCE_ID || 'eb8a5be7-990e-47d3-9b36-c922ff0bb3aa' }}
          NOTION_APPLICATIONS_DATA_SOURCE_ID: ${{ vars.NOTION_APPLICATIONS_DATA_SOURCE_ID || 'a6925702-0d2a-4d68-919b-3401e1d8ff75' }}
        run: |
          set -euo pipefail
          python scripts/gemini_preflight.py
          JOB_PATH="${{ github.event.inputs.job_path || github.event.client_payload.job_path || 'jobs/example.json' }}"
          CONTEXT_PATH="${{ github.event.inputs.browser_context_path || github.event.client_payload.browser_context_path || '' }}"
          if [ -n "$CONTEXT_PATH" ]; then
            python -m career_os.orchestrator --profile config/master_profile.md --job-json "$JOB_PATH" --browser-context-json "$CONTEXT_PATH"
          else
            python -m career_os.orchestrator --profile config/master_profile.md --job-json "$JOB_PATH"
          fi
