name: Career OS — Process Job

on:
  workflow_dispatch:
    inputs:
      job_json:
        description: "Path to a job JSON file committed to the repository"
        required: true
        default: "examples/job.json"

env:
  PYTHONUNBUFFERED: "1"

jobs:
  process-job:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      models: read

    steps:
      - name: Checkout Career OS
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Career OS
        run: pip install -e .

      - name: Validate job input
        run: python -m json.tool "${{ inputs.job_json }}" >/dev/null

      - name: Run multi-agent pipeline with GitHub Models
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MODEL: ${{ vars.GITHUB_MODEL || 'openai/gpt-4.1-mini' }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_REVIEW_QUEUE_PAGE_ID: ${{ secrets.NOTION_REVIEW_QUEUE_PAGE_ID }}
          NOTION_VERSION: ${{ vars.NOTION_VERSION || '2022-06-28' }}
        run: |
          set -o pipefail
          career-os \
            --profile config/master_profile.md \
            --job-json "${{ inputs.job_json }}" | tee pipeline-result.json

      - name: Upload pipeline result
        if: ${{ always() && hashFiles('pipeline-result.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: career-os-result
          path: pipeline-result.json
          retention-days: 14
