name: Career OS — Agent Failure Handoff (manual only)

# Automatic failure-to-Codex chaining is disabled while the pipeline is being
# rebuilt stage-by-stage. Failures must not create another workflow cascade.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Failed workflow run ID
        required: true
        type: string
      workflow_name:
        description: Failed workflow name
        required: true
        type: string
      head_sha:
        description: Failed workflow commit SHA
        required: true
        type: string
      run_url:
        description: Failed workflow URL
        required: true
        type: string
      conclusion:
        description: Failed workflow conclusion
        required: true
        default: failure
        type: string

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  handoff:
    if: ${{ inputs.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create manual repair handoff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ inputs.run_url }}
          RUN_ID: ${{ inputs.run_id }}
          WORKFLOW: ${{ inputs.workflow_name }}
          SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          cat > /tmp/body.md <<EOF
          ## Career OS manual agent handoff

          Workflow: **$WORKFLOW**
          Run: $RUN_URL
          Run ID: \`$RUN_ID\`
          Commit: \`$SHA\`

          Automatic failure chaining is intentionally disabled during staged repair.
          Inspect the failed run, identify the exact stage/step, make the smallest safe fix,
          test it, and only then invoke another stage.
          EOF
          gh issue create --repo "$REPOSITORY" --title "[manual-handoff] $WORKFLOW failed — run $RUN_ID" --body-file /tmp/body.md || true
