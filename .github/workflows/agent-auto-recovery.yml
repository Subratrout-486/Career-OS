name: Career OS — Automatic Failure Recovery

on:
  workflow_run:
    workflows:
      - "Career OS — Job Intake"
      - "Run Career OS Pipeline"
    types: [completed]

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  recover:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1 }}
    runs-on: ubuntu-latest
    steps:
      - name: Inspect failure and recover transient failures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
        run: |
          set -euo pipefail
          gh run view "$RUN_ID" --repo "$REPOSITORY" --json jobs,conclusion,name,headSha > /tmp/run.json
          python - <<'PY'
          import json, os, re, subprocess
          data = json.load(open('/tmp/run.json', encoding='utf-8'))
          transient = re.compile(r'(429|502|503|504|rate limit|timed out|timeout|temporar|connection reset|connection refused|network|service unavailable|gateway)', re.I)
          jobs = data.get('jobs', [])
          failed = [j for j in jobs if j.get('conclusion') == 'failure']
          diagnostics = []
          retry_ids = []
          for job in failed:
              jid = str(job.get('databaseId') or job.get('id'))
              try:
                  logs = subprocess.check_output([
                      'gh','run','view',os.environ['RUN_ID'],'--repo',os.environ['REPOSITORY'],
                      '--log-failed'
                  ], text=True, stderr=subprocess.STDOUT, timeout=90)
              except Exception as exc:
                  logs = str(exc)
              is_transient = bool(transient.search(logs))
              diagnostics.append(f"- {job.get('name','unknown')}: transient={is_transient}")
              if is_transient and jid:
                  retry_ids.append(jid)
          print('Failure classification:')
          print('\n'.join(diagnostics) or '- No failed jobs found')
          if retry_ids:
              print(f"Retrying failed jobs once: {', '.join(retry_ids)}")
              for jid in retry_ids:
                  subprocess.run([
                      'gh','api',f'repos/{os.environ["REPOSITORY"]}/actions/jobs/{jid}/rerun',
                      '--method','POST'
                  ], check=True)
              print('Automatic transient recovery requested.')
          else:
              print('No safe transient retry identified; creating engineering handoff.')
              body = f'''## Career OS automated failure handoff

Workflow: **{os.environ['WORKFLOW']}**  
Run: {os.environ['RUN_URL']}  
Run ID: `{os.environ['RUN_ID']}`

The first automatic recovery pass found no failure that is safe to retry automatically.

### Failed jobs
{chr(10).join(diagnostics) or '- unknown'}

### Required next action
Inspect the failed run, identify the root cause, make the smallest safe fix, run the test suite, and rerun the affected workflow.

### Safety
- Never fabricate career evidence.
- Preserve employer-to-evidence mappings.
- Do not replace the independent xAI/Grok challenger with another provider.
- Never expose secrets.
- Never auto-submit applications.
'''
              subprocess.run([
                  'gh','issue','create','--repo',os.environ['REPOSITORY'],
                  '--title',f"[agent-handoff] {os.environ['WORKFLOW']} failed — run {os.environ['RUN_ID']}",
                  '--body',body
              ], check=True)
          PY
