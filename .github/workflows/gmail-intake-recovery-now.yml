name: Career OS — Gmail Intake Recovery (manual only)

# Legacy recovery is intentionally manual. The production Stage-1 Gmail worker
# is .github/workflows/gmail-job-intake.yml. This workflow must never run on
# every repository commit, otherwise code changes can create duplicate intake
# runs and failure noise.

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  recovery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Ingest Gmail job alerts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_QUERY: ${{ vars.GMAIL_QUERY || 'newer_than:7d (job OR jobs OR career OR opportunity OR hiring OR support)' }}
          MAX_NEW_EMAIL_JOBS: '10'
          GMAIL_PAGE_SIZE: '100'
          GMAIL_MAX_PAGES: '10'
        run: python scripts/gmail_job_intake_runner.py
