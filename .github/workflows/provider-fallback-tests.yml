name: Career OS — Provider Fallback Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e .

      - name: Run provider fallback regression tests
        run: pytest -q tests/test_provider_fallback_regression.py tests/test_specialist_routing.py
