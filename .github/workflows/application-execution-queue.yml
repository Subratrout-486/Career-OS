name: Career OS — Manus Browser Execution

on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'Lifecycle phase to run. Start/poll preflight before dispatch; reconcile after Manus task completion.'
        required: true
        type: choice
        default: preflight_start
        options:
          - preflight_start
          - preflight_poll
          - dispatch
          - reconcile
      pipeline_result_path:
        description: 'Pipeline result JSON with durable Application and Resume Library IDs (required for preflight phases)'
        required: false
        default: ''
      approved_questions_path:
        description: 'Optional user-approved Application Questions export JSON; never use an unapproved browser answer'
        required: false
        default: ''
      manifest_path:
        description: 'Verified browser execution manifest path (created by preflight_poll; required for dispatch)'
        required: false
        default: 'browser_execution_manifest.json'
      state_path:
        description: 'Durable preflight/execution state JSON, committed or securely staged before a rerun'
        required: true
        default: 'browser_execution_state.json'

permissions:
  contents: read

concurrency:
  group: career-os-manus-browser-execution
  cancel-in-progress: false

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    env:
      MANUS_API_KEY: ${{ secrets.MANUS_API_KEY }}
      CAREER_OS_EXECUTION_ENABLED: ${{ vars.CAREER_OS_EXECUTION_ENABLED }}
      MANUS_BROWSER_AGENT_PROFILE: ${{ vars.MANUS_BROWSER_AGENT_PROFILE || 'manus-1.6' }}
      PHASE: ${{ inputs.phase }}
      PIPELINE_RESULT_PATH: ${{ inputs.pipeline_result_path }}
      APPROVED_QUESTIONS_PATH: ${{ inputs.approved_questions_path }}
      MANIFEST_PATH: ${{ inputs.manifest_path }}
      STATE_PATH: ${{ inputs.state_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Career OS
        run: pip install .

      - name: Validate controlled lifecycle inputs
        run: |
          test -n "$MANUS_API_KEY" || { echo 'MANUS_API_KEY secret is not configured; no task created.'; exit 1; }
          test "$CAREER_OS_EXECUTION_ENABLED" = 'true' || { echo 'CAREER_OS_EXECUTION_ENABLED repository variable must be true; no task created.'; exit 1; }
          case "$PHASE" in
            preflight_start|preflight_poll)
              test -n "$PIPELINE_RESULT_PATH" || { echo 'pipeline_result_path is required for preflight.'; exit 1; }
              test -f "$PIPELINE_RESULT_PATH" || { echo "Pipeline result not found: $PIPELINE_RESULT_PATH"; exit 1; }
              ;;
            dispatch)
              test -f "$MANIFEST_PATH" || { echo "Verified manifest not found: $MANIFEST_PATH"; exit 1; }
              ;;
            reconcile)
              test -f "$STATE_PATH" || { echo "Durable execution state not found: $STATE_PATH"; exit 1; }
              ;;
          esac
          if test -n "$APPROVED_QUESTIONS_PATH"; then test -f "$APPROVED_QUESTIONS_PATH" || { echo "Approved-question export not found: $APPROVED_QUESTIONS_PATH"; exit 1; }; fi

      - name: Create inspection-only Manus browser preflight
        if: inputs.phase == 'preflight_start'
        run: |
          args=(--pipeline-result "$PIPELINE_RESULT_PATH" --state "$STATE_PATH" --output browser_preflight_result.json)
          if test -n "$APPROVED_QUESTIONS_PATH"; then args+=(--approved-questions "$APPROVED_QUESTIONS_PATH"); fi
          python scripts/run_manus_browser_preflight.py start "${args[@]}"

      - name: Poll preflight and generate verified execution manifest
        if: inputs.phase == 'preflight_poll'
        run: |
          args=(--pipeline-result "$PIPELINE_RESULT_PATH" --state "$STATE_PATH" --manifest-output "$MANIFEST_PATH" --output browser_preflight_result.json)
          if test -n "$APPROVED_QUESTIONS_PATH"; then args+=(--approved-questions "$APPROVED_QUESTIONS_PATH"); fi
          python scripts/run_manus_browser_preflight.py poll "${args[@]}"

      - name: Create auditable Manus browser execution tasks
        if: inputs.phase == 'dispatch'
        run: python scripts/dispatch_manus_browser_tasks.py --manifest "$MANIFEST_PATH" --state "$STATE_PATH" --results browser_execution_results.json

      - name: Poll tasks and reconcile confirmed submissions
        if: inputs.phase == 'reconcile'
        run: python scripts/reconcile_manus_browser_execution.py --state "$STATE_PATH" --results browser_submission_reconciliation.json

      - name: Retain lifecycle evidence and durable state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: career-os-browser-execution-${{ inputs.phase }}
          path: |
            browser_preflight_result.json
            browser_execution_manifest.json
            browser_execution_results.json
            browser_submission_reconciliation.json
            ${{ inputs.state_path }}
          if-no-files-found: warn
          retention-days: 30
