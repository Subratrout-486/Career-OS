name: Career OS — Manus Browser Execution

on:
  workflow_dispatch:
    inputs:
      manifest_path:
        description: 'Path to a verified browser-execution manifest committed or securely staged for this run'
        required: true
        default: 'browser_execution_manifest.json'

permissions:
  contents: read

concurrency:
  group: career-os-manus-browser-execution
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      MANUS_API_KEY: ${{ secrets.MANUS_API_KEY }}
      CAREER_OS_EXECUTION_ENABLED: ${{ vars.CAREER_OS_EXECUTION_ENABLED }}
      MANUS_BROWSER_AGENT_PROFILE: ${{ vars.MANUS_BROWSER_AGENT_PROFILE || 'manus-1.6' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Career OS
        run: pip install .

      - name: Validate verified manifest is present
        env:
          MANIFEST_PATH: ${{ inputs.manifest_path }}
        run: |
          test -n "$MANUS_API_KEY" || { echo 'MANUS_API_KEY secret is not configured; no task created.'; exit 1; }
          test "$CAREER_OS_EXECUTION_ENABLED" = 'true' || { echo 'CAREER_OS_EXECUTION_ENABLED repository variable must be true; no task created.'; exit 1; }
          test -f "$MANIFEST_PATH" || { echo "Verified manifest not found: $MANIFEST_PATH"; exit 1; }

      - name: Create auditable Manus browser tasks
        env:
          MANIFEST_PATH: ${{ inputs.manifest_path }}
        run: python scripts/dispatch_manus_browser_tasks.py --manifest "$MANIFEST_PATH" --results browser_execution_results.json

      - name: Retain execution results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: career-os-browser-execution-results
          path: browser_execution_results.json
          if-no-files-found: warn
          retention-days: 30
