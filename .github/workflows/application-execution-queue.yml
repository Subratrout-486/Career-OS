name: Career OS — Manus Browser Execution (Stage 5 — gated)

# Browser execution must never start from Stage 1 intake. Keep this workflow
# manually invokable until matching, resume generation, readiness and queue
# reconciliation have each been verified independently.

on:
  workflow_dispatch:
    inputs:
      resume_queue:
        description: 'Resume a previously verified browser lifecycle state.'
        required: false
        type: boolean
        default: true
      intake_run_id:
        description: 'Optional trusted downstream intake run to replay.'
        required: false
        type: string
      lifecycle_run_id:
        description: 'Optional retained lifecycle run to resume.'
        required: false
        type: string

permissions:
  actions: read
  contents: read

jobs:
  gated:
    runs-on: ubuntu-latest
    steps:
      - name: Stage 5 gate
        run: |
          echo 'STAGE_5_GATED'
          echo 'Automatic Manus/browser execution is disabled while earlier pipeline stages are being verified.'
          echo 'No browser task is created from intake-only workflows.'
