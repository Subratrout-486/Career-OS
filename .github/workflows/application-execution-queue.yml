name: Career OS — Manus Browser Execution

on:
  workflow_run:
    workflows:
      - "Career OS — Job Discovery"
      - "Career OS — Gmail Job Intake"
      - "Career OS — Specialist Source Intake"
      - "Career OS — Job Intake"
    types: [completed]
  schedule:
    # Poll already-created Manus tasks without any operator staging or phase dispatch.
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      resume_queue:
        description: 'Optional operational retry; uses only the already persisted lifecycle workspace.'
        required: false
        type: boolean
        default: true
      intake_run_id:
        description: 'Optional completed trusted Job Intake run ID for a preflight-only replay.'
        required: false
        type: string
      lifecycle_run_id:
        description: 'Optional completed Career OS browser lifecycle run ID to resume exactly one retained task state.'
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: career-os-manus-browser-execution
  cancel-in-progress: false

jobs:
  lifecycle:
    # Do not react to an unsuccessful intake run; its candidate artifact cannot
    # be trusted. Scheduled/manual queue runs restore only persisted state.
    if: >-
      ${{ github.event_name != 'workflow_run' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.name != 'Career OS — Manus Browser Execution') }}
    runs-on: ubuntu-latest
    env:
      MANUS_API_KEY: ${{ secrets.MANUS_API_KEY }}
      CAREER_OS_EXECUTION_ENABLED: ${{ vars.CAREER_OS_EXECUTION_ENABLED }}
      MANUS_BROWSER_AGENT_PROFILE: ${{ vars.MANUS_BROWSER_AGENT_PROFILE || 'manus-1.6' }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Career OS
        run: pip install .

      - name: Locate latest persisted lifecycle workspace
        id: persisted
        run: |
          set -euo pipefail
          artifact_endpoint="repos/${GITHUB_REPOSITORY}/actions/artifacts?name=career-os-browser-lifecycle-state&per_page=100"
          artifact_id="$(gh api "$artifact_endpoint" --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty' || true)"
          artifact_run_id="$(gh api "$artifact_endpoint" --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .workflow_run.id // empty' || true)"
          echo "artifact_id=${artifact_id}" >> "$GITHUB_OUTPUT"
          echo "artifact_run_id=${artifact_run_id}" >> "$GITHUB_OUTPUT"
          if [ -n "$artifact_id" ] && [ -n "$artifact_run_id" ]; then
            echo 'found=true' >> "$GITHUB_OUTPUT"
          else
            echo 'found=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Validate manually selected lifecycle state
        if: github.event_name == 'workflow_dispatch' && inputs.lifecycle_run_id != ''
        id: manual_state
        run: |
          set -euo pipefail
          run_id='${{ inputs.lifecycle_run_id }}'
          case "$run_id" in *[!0-9]*|'') echo 'lifecycle_run_id must be numeric.' >&2; exit 1 ;; esac
          endpoint="repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
          test "$(gh api "$endpoint" --jq .name)" = 'Career OS — Manus Browser Execution' || { echo 'Refusing non-lifecycle source run.' >&2; exit 1; }
          test "$(gh api "$endpoint" --jq .conclusion)" = 'success' || { echo 'Selected lifecycle run was not successful.' >&2; exit 1; }
          artifact_id="$(gh api "${endpoint}/artifacts" --jq '[.artifacts[] | select(.name == "career-os-browser-lifecycle-state" and .expired == false)] | sort_by(.created_at) | last | .id // empty')"
          test -n "$artifact_id" || { echo 'Selected lifecycle run has no retained state artifact.' >&2; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"

      - name: Restore persisted browser lifecycle workspace
        # A selected source-run replay remains isolated to that candidate; an
        # explicit state run resumes exactly its retained task state.
        if: (steps.persisted.outputs.found == 'true' && !(github.event_name == 'workflow_dispatch' && (inputs.intake_run_id != '' || inputs.lifecycle_run_id != ''))) || (github.event_name == 'workflow_dispatch' && inputs.lifecycle_run_id != '')
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.lifecycle_run_id != '' && steps.manual_state.outputs.run_id || steps.persisted.outputs.artifact_run_id }}
          artifact-ids: ${{ inputs.lifecycle_run_id != '' && steps.manual_state.outputs.artifact_id || steps.persisted.outputs.artifact_id }}
          path: .

      - name: Normalize restored lifecycle workspace
        if: (steps.persisted.outputs.found == 'true' && !(github.event_name == 'workflow_dispatch' && (inputs.intake_run_id != '' || inputs.lifecycle_run_id != ''))) || (github.event_name == 'workflow_dispatch' && inputs.lifecycle_run_id != '')
        run: |
          set -euo pipefail
          artifact_dir='career-os-browser-lifecycle-state'
          if [ -d "${artifact_dir}/browser_lifecycle" ]; then
            rm -rf browser_lifecycle
            mv "${artifact_dir}/browser_lifecycle" browser_lifecycle
          fi
          if [ -f "${artifact_dir}/browser_lifecycle_result.json" ]; then
            mv "${artifact_dir}/browser_lifecycle_result.json" browser_lifecycle_result.json
          fi

      - name: Validate manually selected trusted intake run
        if: github.event_name == 'workflow_dispatch' && inputs.intake_run_id != ''
        id: manual_source
        run: |
          set -euo pipefail
          run_id='${{ inputs.intake_run_id }}'
          case "$run_id" in
            *[!0-9]*|'') echo 'intake_run_id must be a numeric Actions run ID.' >&2; exit 1 ;;
          esac
          run_endpoint="repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
          run_name="$(gh api "$run_endpoint" --jq .name)"
          conclusion="$(gh api "$run_endpoint" --jq .conclusion)"
          case "$run_name" in
            'Career OS — Job Discovery'|'Career OS — Gmail Job Intake'|'Career OS — Specialist Source Intake'|'Career OS — Job Intake') ;;
            *) echo "Refusing untrusted source workflow: $run_name" >&2; exit 1 ;;
          esac
          test "$conclusion" = 'success' || { echo 'Selected intake run was not successful.' >&2; exit 1; }
          artifact_id="$(gh api "${run_endpoint}/artifacts" --jq '[.artifacts[] | select(.name == "career-os-browser-lifecycle-candidates" and .expired == false)] | sort_by(.created_at) | last | .id // empty')"
          test -n "$artifact_id" || { echo 'Selected successful intake has no retained trusted candidate artifact.' >&2; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"

      - name: Ingest new trusted pipeline candidates automatically
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: career-os-browser-lifecycle-candidates
          path: browser_lifecycle
          merge-multiple: true

      - name: Ingest manually selected trusted pipeline candidate
        if: github.event_name == 'workflow_dispatch' && inputs.intake_run_id != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.manual_source.outputs.run_id }}
          artifact-ids: ${{ steps.manual_source.outputs.artifact_id }}
          path: browser_lifecycle
          merge-multiple: true

      - name: Detect trusted work for automatic lifecycle
        id: work
        run: |
          if find browser_lifecycle/pipeline_results -type f -name '*.json' -print -quit 2>/dev/null | grep -q . || [ -f browser_lifecycle/browser_execution_state.json ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'No new trusted candidate or persisted browser task exists; queue run is a safe no-op.'
          fi

      - name: Validate automatic lifecycle prerequisites
        if: steps.work.outputs.available == 'true'
        run: |
          set -euo pipefail
          test -n "$MANUS_API_KEY" || { echo 'MANUS_API_KEY secret is not configured; no task created.'; exit 1; }
          test "$CAREER_OS_EXECUTION_ENABLED" = 'true' || { echo 'CAREER_OS_EXECUTION_ENABLED repository variable must be true; no task created.'; exit 1; }

      - name: Advance preflight, verified dispatch, and submission reconciliation
        if: steps.work.outputs.available == 'true'
        run: python scripts/run_manus_browser_lifecycle.py --workspace browser_lifecycle --output browser_lifecycle_result.json

      - name: Retain complete durable lifecycle workspace
        # Do not let an empty scheduled/manual no-op shadow a real retained
        # lifecycle state as the latest artifact.
        if: always() && steps.work.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          # A constant name lets a later scheduled run discover the newest
          # private state through the Actions API; the artifact remains scoped
          # to this run and carries state, candidates, exact resumes, manifests,
          # and all browser evidence together.
          name: career-os-browser-lifecycle-state
          path: |
            browser_lifecycle/
            browser_lifecycle_result.json
          if-no-files-found: warn
          retention-days: 30
