name: Career OS — Manus Browser Execution

on:
  workflow_run:
    workflows:
      - "Career OS — Job Discovery"
      - "Career OS — Gmail Job Intake"
      - "Career OS — Specialist Source Intake"
      - "Career OS — Job Intake"
    types: [completed]
  schedule:
    # Poll already-created Manus tasks without any operator staging or phase dispatch.
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      resume_queue:
        description: 'Optional operational retry; uses only the already persisted lifecycle workspace.'
        required: false
        type: boolean
        default: true

permissions:
  actions: read
  contents: read

concurrency:
  group: career-os-manus-browser-execution
  cancel-in-progress: false

jobs:
  lifecycle:
    # Do not react to an unsuccessful intake run; its candidate artifact cannot
    # be trusted. Scheduled/manual queue runs restore only persisted state.
    if: >-
      ${{ github.event_name != 'workflow_run' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.name != 'Career OS — Manus Browser Execution') }}
    runs-on: ubuntu-latest
    env:
      MANUS_API_KEY: ${{ secrets.MANUS_API_KEY }}
      CAREER_OS_EXECUTION_ENABLED: ${{ vars.CAREER_OS_EXECUTION_ENABLED }}
      MANUS_BROWSER_AGENT_PROFILE: ${{ vars.MANUS_BROWSER_AGENT_PROFILE || 'manus-1.6' }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Career OS
        run: pip install .

      - name: Locate latest persisted lifecycle workspace
        id: persisted
        run: |
          set -euo pipefail
          artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=career-os-browser-lifecycle-state&per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | .id' | head -n1 || true)"
          echo "artifact_id=${artifact_id}" >> "$GITHUB_OUTPUT"
          if [ -n "$artifact_id" ]; then
            echo 'found=true' >> "$GITHUB_OUTPUT"
          else
            echo 'found=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Restore persisted browser lifecycle workspace
        if: steps.persisted.outputs.found == 'true'
        uses: actions/download-artifact@v4
        with:
          # The state artifact belongs to an earlier workflow run, not this
          # scheduled or workflow_run invocation.  A cross-run download must
          # authenticate explicitly; otherwise the action only searches the
          # current run and reports the known artifact ID as missing.
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          artifact-ids: ${{ steps.persisted.outputs.artifact_id }}
          path: .

      - name: Ingest new trusted pipeline candidates automatically
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: career-os-browser-lifecycle-candidates
          path: browser_lifecycle
          merge-multiple: true

      - name: Detect trusted work for automatic lifecycle
        id: work
        run: |
          if find browser_lifecycle/pipeline_results -type f -name '*.json' -print -quit 2>/dev/null | grep -q . || [ -f browser_lifecycle/browser_execution_state.json ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'No new trusted candidate or persisted browser task exists; queue run is a safe no-op.'
          fi

      - name: Validate automatic lifecycle prerequisites
        if: steps.work.outputs.available == 'true'
        run: |
          set -euo pipefail
          test -n "$MANUS_API_KEY" || { echo 'MANUS_API_KEY secret is not configured; no task created.'; exit 1; }
          test "$CAREER_OS_EXECUTION_ENABLED" = 'true' || { echo 'CAREER_OS_EXECUTION_ENABLED repository variable must be true; no task created.'; exit 1; }

      - name: Advance preflight, verified dispatch, and submission reconciliation
        if: steps.work.outputs.available == 'true'
        run: python scripts/run_manus_browser_lifecycle.py --workspace browser_lifecycle --output browser_lifecycle_result.json

      - name: Retain complete durable lifecycle workspace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # A constant name lets a later scheduled run discover the newest
          # private state through the Actions API; the artifact remains scoped
          # to this run and carries state, candidates, exact resumes, manifests,
          # and all browser evidence together.
          name: career-os-browser-lifecycle-state
          path: |
            browser_lifecycle/
            browser_lifecycle_result.json
          if-no-files-found: warn
          retention-days: 30
