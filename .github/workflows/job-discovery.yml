name: Career OS — Job Discovery

on:
  schedule:
    # 08:00 Asia/Kolkata = 02:30 UTC; GitHub Actions cron is UTC.
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: career-os-job-discovery
  cancel-in-progress: true

jobs:
  discover-intake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Discover fresh employer ATS jobs
        id: discovery
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_NEW_JOBS: '25'
          DISCOVERY_DAYS: '45'
        run: python scripts/discover_jobs.py

      - name: Validate Stage 1 intake contract
        run: |
          set -euo pipefail
          if [ ! -f discovered_paths.txt ]; then
            printf 'discovered=0\n' > intake-summary.txt
            echo 'No discovery output file was produced; treating this as a valid empty intake.'
            exit 0
          fi
          python scripts/intake_contract.py --paths discovered_paths.txt --report intake-contract-report.json
          discovered="$(grep -cve '^$' discovered_paths.txt || true)"
          printf 'discovered=%s\n' "$discovered" > intake-summary.txt
          echo "Career OS Stage 1 discovered and validated ${discovered} candidate job records."

      - name: Publish Stage 1 intake evidence only
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: career-os-stage1-intake-${{ github.run_id }}
          path: |
            discovered_paths.txt
            intake-summary.txt
            intake-contract-report.json
            intake_rejected.json
            jobs/discovery_runtime/
          if-no-files-found: warn
          retention-days: 14

      - name: Persist validated Stage 1 records
        if: ${{ steps.discovery.outcome == 'success' }}
        id: persist
        run: |
          set -euo pipefail
          git config user.name 'career-os-bot'
          git config user.email '41898282+github-actions[bot]@github.com'
          mkdir -p jobs/discovery_runtime jobs/email_runtime
          git add jobs/discovery_runtime jobs/email_runtime
          if git diff --cached --quiet; then
            echo 'No new Stage 1 records to persist.'
          else
            git commit -m 'chore: persist Stage 1 discovery records'
            git push
          fi

      - name: Stage 1 hard boundary
        run: |
          echo 'STAGE_1_INTAKE_COMPLETE'
          echo 'HANDOFF: INTAKED records are durable and validated.'
          echo 'BLOCKED: matching, JD enrichment, resume generation, Notion processing, and browser execution.'
