name: Career OS — Job Discovery

on:
  schedule:
    # 08:00 Asia/Kolkata = 02:30 UTC; GitHub Actions cron is UTC.
    - cron: '30 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/discover_jobs.py'
      - 'scripts/direct_career_watcher.py'
      - 'config/company_watchlist.json'
      - '.github/workflows/job-discovery.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: career-os-job-discovery
  cancel-in-progress: true

jobs:
  discover-intake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Discover fresh employer ATS jobs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_NEW_JOBS: '25'
          DISCOVERY_DAYS: '45'
        run: python scripts/discover_jobs.py

      - name: Validate intake output
        run: |
          set -euo pipefail
          if [ ! -f discovered_paths.txt ]; then
            printf 'discovered=0\n' > intake-summary.txt
            echo 'No discovery output file was produced; treating this as a valid empty intake.'
            exit 0
          fi
          discovered="$(grep -cve '^$' discovered_paths.txt || true)"
          printf 'discovered=%s\n' "$discovered" > intake-summary.txt
          echo "Career OS intake discovered ${discovered} candidate job records."
          if [ "$discovered" -gt 0 ]; then
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              test -f "$path"
            done < discovered_paths.txt
          fi

      - name: Publish intake candidates only
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: career-os-intake-candidates
          path: |
            discovered_paths.txt
            intake-summary.txt
            jobs/discovery_runtime/
          if-no-files-found: warn
          retention-days: 14

      - name: Intake stage boundary
        run: |
          echo 'STAGE_1_INTAKE_COMPLETE'
          echo 'Downstream matching/resume/browser execution is intentionally not started in this stage.'
