name: Career OS — Job Processing

# Trusted intake issues are the durable handoff between discovery and the real
# pipeline. The workflow processes that handoff instead of stopping at a gate.
# STAGE_2_GATED: requires the trusted CAREER_OS_JOB_V1 intake marker before processing.
on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Trusted Career OS intake issue to process.'
        required: true
        type: string
      ai_provider:
        description: 'Provider preference for this run.'
        required: false
        default: auto
        type: choice
        options:
          - auto
          - manus
          - gemini
          - xai
          - deepseek

permissions:
  contents: read
  issues: write

concurrency:
  group: career-os-job-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  AI_PROVIDER: ${{ inputs.ai_provider || 'auto' }}
  AI_REQUEST_TIMEOUT_SECONDS: '60'
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  process:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.issue.body, '<!-- CAREER_OS_JOB_V1 -->') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Career OS
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Resolve issue number
        id: issue
        env:
          EVENT_ISSUE: ${{ github.event.issue.number }}
          INPUT_ISSUE: ${{ inputs.issue_number }}
        run: |
          ISSUE_NUMBER="$EVENT_ISSUE"
          if [ -z "$ISSUE_NUMBER" ]; then ISSUE_NUMBER="$INPUT_ISSUE"; fi
          test -n "$ISSUE_NUMBER"
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Process one intake through the durable harness
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          MANUS_MODEL: ${{ vars.MANUS_MODEL || 'gpt-5-mini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_MODEL: ${{ vars.XAI_MODEL || 'grok-4.6' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-chat' }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_REVIEW_QUEUE_PAGE_ID: ${{ secrets.NOTION_REVIEW_QUEUE_PAGE_ID }}
          NOTION_EVIDENCE_VAULT_DATA_SOURCE_ID: ${{ vars.NOTION_EVIDENCE_VAULT_DATA_SOURCE_ID || 'eb8a5be7-990e-47d3-9b36-c922ff0bb3aa' }}
          NOTION_RESUME_LIBRARY_DATA_SOURCE_ID: ${{ vars.NOTION_RESUME_LIBRARY_DATA_SOURCE_ID || '3ac8bc1d-ce0e-8051-a553-000bb5f58abe' }}
          NOTION_APPLICATIONS_DATA_SOURCE_ID: ${{ vars.NOTION_APPLICATIONS_DATA_SOURCE_ID || 'a6925702-0d2a-4d68-919b-3401e1d8ff75' }}
          NOTION_VERSION: ${{ vars.NOTION_VERSION || '2026-03-11' }}
        run: |
          python scripts/process_intake_issue.py \
            --issue-number "${{ steps.issue.outputs.issue_number }}"

      - name: Publish pipeline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: career-os-pipeline-${{ github.run_id }}
          path: |
            jobs/pipeline_runtime/
            generated_resumes/
          if-no-files-found: warn
          retention-days: 14
