name: Career OS — Job Processing (Stage 2 — gated)

# Stage 2 is intentionally disabled while Stage 1 intake is being repaired.
# Jobs are allowed to accumulate as intake records, but opening an intake issue
# must NOT launch the full AI/matching/resume pipeline.

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Existing trusted Career OS intake issue to process after Stage 1 is verified.'
        required: true
        type: string
      ai_provider:
        description: 'Provider override for controlled Stage 2 replay.'
        required: false
        default: auto
        type: choice
        options:
          - auto
          - gemini

permissions:
  contents: read
  issues: write
  models: read

jobs:
  gated:
    runs-on: ubuntu-latest
    steps:
      - name: Stage 2 gate
        run: |
          echo 'STAGE_2_GATED'
          echo 'Automatic issue-triggered processing is disabled until Stage 1 intake is verified.'
          echo "Requested issue: ${{ inputs.issue_number }}"
          echo 'No AI matching, resume generation, Notion sync, or browser execution is started.'
