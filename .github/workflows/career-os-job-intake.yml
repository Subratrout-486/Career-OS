name: Career OS — Conductor Handoff

# STAGE_2_GATED: trusted Career OS intake is handed to Conductor at this boundary.
# Stage 2 is intentionally a handoff boundary.
# GitHub Actions does not call paid LLM APIs. It validates the trusted intake
# and leaves the job issue available for Conductor/AgentFlow to consume.
# Conductor is the AI runtime for JD analysis, evidence reasoning, resume work,
# challenger review and browser/app delegation.
on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Trusted Career OS intake issue to hand off to Conductor.'
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: career-os-conductor-handoff-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  handoff:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.issue.body, '<!-- CAREER_OS_JOB_V1 -->') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve issue number
        id: issue
        env:
          EVENT_ISSUE: ${{ github.event.issue.number }}
          INPUT_ISSUE: ${{ inputs.issue_number }}
        run: |
          ISSUE_NUMBER="$EVENT_ISSUE"
          if [ -z "$ISSUE_NUMBER" ]; then ISSUE_NUMBER="$INPUT_ISSUE"; fi
          test -n "$ISSUE_NUMBER"
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Validate Conductor handoff marker
        env:
          EVENT_BODY: ${{ github.event.issue.body }}
        run: |
          if [ -n "$EVENT_BODY" ] && ! printf '%s' "$EVENT_BODY" | grep -q '<!-- CAREER_OS_JOB_V1 -->'; then
            echo 'Not a trusted Career OS intake issue.'
            exit 1
          fi
          echo 'Trusted Career OS intake confirmed.'

      - name: Record AI-runtime boundary
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.issue_number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file - <<'EOF'
          ### Career OS → Conductor handoff

          **Status:** `READY_FOR_CONDUCTOR`

          This intake is intentionally **not** sent to xAI, Gemini, DeepSeek, OpenAI API, or any other paid model API by GitHub Actions.

          Conductor/AgentFlow is the designated AI runtime. It should consume this trusted intake and delegate the job-search/JD/fit/resume/review/browser work to the configured agents and connected apps.

          GitHub remains the durable queue and audit surface. Career OS truth/evidence and application safety gates remain authoritative.
          EOF
