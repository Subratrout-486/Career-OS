name: Career OS — Job Intake

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Existing trusted Career OS issue number to replay through the full gated pipeline.'
        required: true
        type: string
permissions:

  contents: write
  issues: write
  models: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  intake-and-process:
    if: |
      (
        github.event_name == 'workflow_dispatch' &&
        inputs.issue_number != ''
      ) ||
      (
        github.event_name == 'issues' &&
        contains(github.event.issue.body, 'CAREER_OS_JOB_V1') &&
        (
          github.event.issue.user.login == github.repository_owner ||
          github.event.issue.author_association == 'OWNER' ||
          github.event.issue.author_association == 'MEMBER' ||
          github.event.issue.author_association == 'COLLABORATOR'
        )
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Career OS
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Extract job JSON from issue
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A manual replay is restricted to users who can dispatch repository
          # workflows. It reuses the immutable issue body rather than accepting
          # ad-hoc job data or bypassing the established intake validation.
          if [ -z "${ISSUE_BODY:-}" ]; then
            ISSUE_BODY="$(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          fi
          export ISSUE_BODY
          python - <<'PY'
          import json, os, re
          body = os.environ.get('ISSUE_BODY', '')
          match = re.search(r'<!--\s*CAREER_OS_JOB_V1\s*-->.*?```json\s*(.*?)\s*```', body, re.S)
          if not match:
              raise SystemExit('Career OS job payload was not found in the issue body.')
          data = json.loads(match.group(1))
          required = ['title', 'company', 'location', 'description']
          missing = [key for key in required if not str(data.get(key, '')).strip()]
          if missing:
              raise SystemExit(f'Missing required job fields: {missing}')
          data.setdefault('url', '')
          data.setdefault('source', 'browser-extension')
          data.setdefault('captured_at', '')
          path = f"jobs/inbox/issue-{os.environ['ISSUE_NUMBER']}.json"
          os.makedirs(os.path.dirname(path), exist_ok=True)
          with open(path, 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write('\n')
          print(path)
          PY

      - name: Install Career OS
        run: pip install -e .

      - name: Resolve existing Applications record for automatic re-evaluation
        id: existing_application
        if: github.event.action == 'reopened' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100" --paginate > /tmp/issue-comments.json
          python - <<'PY'
          import json
          import os
          import re

          with open('/tmp/issue-comments.json', encoding='utf-8') as f:
              comments = json.load(f)
          page_id = None
          for comment in comments:
              body = str(comment.get('body') or '')
              matches = re.findall(r'- Applications: `([0-9a-fA-F-]{36})`', body)
              if matches:
                  page_id = matches[-1]
          if not page_id:
              raise SystemExit(
                  'Automatic re-evaluation refused: no existing Applications page ID was found in prior Career OS status.'
              )
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f'application_page_id={page_id}\n')
          PY
          echo 'Existing application record will be re-evaluated; submitted records remain protected.'

      - name: Run Career OS pipeline
        env:
          AI_PROVIDER: auto
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MODEL: ${{ vars.GITHUB_MODEL || 'openai/gpt-4.1' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_MODEL: ${{ vars.XAI_MODEL || vars.GROK_MODEL || 'grok-4.6' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-chat' }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_REVIEW_QUEUE_PAGE_ID: ${{ secrets.NOTION_REVIEW_QUEUE_PAGE_ID }}
          NOTION_RESUME_LIBRARY_DATA_SOURCE_ID: ${{ vars.NOTION_RESUME_LIBRARY_DATA_SOURCE_ID || '3ac8bc1d-ce0e-8051-a553-000bb5f58abe' }}
          NOTION_EVIDENCE_VAULT_DATA_SOURCE_ID: ${{ vars.NOTION_EVIDENCE_VAULT_DATA_SOURCE_ID || 'eb8a5be7-990e-47d3-9b36-c922ff0bb3aa' }}
          NOTION_APPLICATIONS_DATA_SOURCE_ID: ${{ vars.NOTION_APPLICATIONS_DATA_SOURCE_ID || 'a6925702-0d2a-4d68-919b-3401e1d8ff75' }}
          NOTION_VERSION: ${{ vars.NOTION_VERSION || '2026-03-11' }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          EXISTING_APPLICATION_PAGE_ID: ${{ steps.existing_application.outputs.application_page_id }}
        run: |
          set -o pipefail
          python scripts/gemini_preflight.py
          extra_args=()
          if [ -n "${EXISTING_APPLICATION_PAGE_ID:-}" ]; then
            extra_args=(--existing-application-page-id "$EXISTING_APPLICATION_PAGE_ID")
          fi
          career-os \
            --profile config/master_profile.md \
            --job-json "jobs/inbox/issue-${ISSUE_NUMBER}.json" \
            "${extra_args[@]}" | tee pipeline-result.json

      - name: Upload pipeline result
        if: ${{ always() && hashFiles('pipeline-result.json') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: career-os-result-issue-${{ github.event.issue.number }}
          path: pipeline-result.json
          retention-days: 14

      - name: Upload generated resume files
        if: ${{ always() && hashFiles('generated_resumes/*') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: career-os-resume-files-issue-${{ github.event.issue.number }}
          path: generated_resumes/*
          retention-days: 14

      - name: Normalize automatic browser-lifecycle workspace
        if: ${{ always() && hashFiles('pipeline-result.json') != '' }}
        run: |
          mkdir -p pipeline_results
          cp pipeline-result.json "pipeline_results/issue-${{ github.event.issue.number }}-result.json"

      - name: Publish self-contained automatic browser-lifecycle candidate
        if: ${{ always() && hashFiles('pipeline_results/*.json') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: career-os-browser-lifecycle-candidates
          path: |
            pipeline_results/
            generated_resumes/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish intake status to issue
        if: ${{ always() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ -s pipeline-result.json ] && python -m json.tool pipeline-result.json >/dev/null 2>&1; then
            python - <<'PY' > /tmp/career-os-comment.md
          import json
          with open('pipeline-result.json', encoding='utf-8') as f:
              result = json.load(f)
          fit = result.get('fit', {})
          status = result.get('review_status', 'UNKNOWN')
          score = fit.get('fit_score', 'n/a')
          recommendation = fit.get('recommendation', 'n/a')
          review = result.get('review_page_id') or 'Notion review page not created.'
          library = result.get('resume_library_page_id') or 'Notion Resume Library entry not created.'
          application = result.get('application_page_id') or 'Notion Applications entry not created.'
          active = (result.get('job_verification') or {}).get('status', 'n/a')
          errors = result.get('errors') or []
          print('## Career OS processing complete')
          print('')
          print(f'- Pipeline status: **{status}**')
          print(f'- Job verification: **{active}**')
          print(f'- Fit score: **{score}**')
          print(f'- Recommendation: **{recommendation}**')
          print(f'- Notion review: `{review}`')
          print(f'- Resume Library: `{library}`')
          print(f'- Applications: `{application}`')
          if errors:
              print('')
              print('### Warnings/errors')
              for error in errors:
                  print(f'- {error}')
          PY
          else
            cat > /tmp/career-os-comment.md <<'EOF'
          ## Career OS processing failed

          The pipeline did not produce valid JSON. Open the workflow run to inspect the failed step.
          EOF
          fi
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            --method POST \
            -f body="$(cat /tmp/career-os-comment.md)"
