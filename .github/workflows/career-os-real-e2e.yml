name: Career OS — Real Job Full E2E (Self-Sufficient Agents)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/run_real_job_self_sufficient_e2e.py'
      - '.github/workflows/career-os-real-e2e.yml'
      - 'src/career_os/direct_provider_runtime.py'
      - 'src/career_os/department_agents.py'
      - 'src/career_os/agents.py'
      - 'src/career_os/pipeline_adapter.py'
      - 'src/career_os/orchestrator.py'
      - 'tests/test_direct_provider_runtime.py'

permissions:
  contents: write
  issues: write

env:
  PYTHONUNBUFFERED: '1'
  PYTHONFAULTHANDLER: '1'
  DISCOVERY_DAYS: '45'
  MAX_NEW_JOBS: '50'
  CAREER_SOURCE_BATCH_SIZE: '8'
  ATS_INDEPENDENT_PASS_THRESHOLD: '60'
  AI_PROVIDER: pool
  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
  DEEPSEEK_MODEL: deepseek-chat
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GEMINI_MODEL: gemini-3.1-flash-lite
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  ANTHROPIC_MODEL: claude-sonnet-4-20250514
  OPENAI_API_KEY: ${{ secrets.MANUS_API_KEY }}
  OPENAI_API_BASE: ${{ secrets.MANUS_API_BASE }}
  GH_TOKEN: ${{ github.token }}
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  real-job-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Career OS
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio httpx pyyaml

      - name: Validate self-sufficient E2E runner syntax
        run: |
          python -m py_compile scripts/run_real_job_self_sufficient_e2e.py
          python -m py_compile src/career_os/department_agents.py
          python -m py_compile src/career_os/direct_provider_runtime.py

      - name: Deterministic and runtime contract tests
        run: |
          python -m pytest -q \
            tests/test_agent_harness.py \
            tests/test_agent_runtime_continuation.py \
            tests/test_pipeline_harness.py \
            tests/test_jd_enrichment_stage.py \
            tests/test_direct_provider_runtime.py \
            tests/test_provider_fallback_regression.py

      - name: Verify specialist provider pool credentials
        run: |
          configured=0
          test -n "$DEEPSEEK_API_KEY" && configured=$((configured+1)) && echo 'DEEPSEEK=CONFIGURED'
          test -n "$GEMINI_API_KEY" && configured=$((configured+1)) && echo 'GEMINI=CONFIGURED'
          test -n "$ANTHROPIC_API_KEY" && configured=$((configured+1)) && echo 'ANTHROPIC=CONFIGURED'
          test "$configured" -ge 1
          echo 'AGENT_RUNTIME=SELF_SUFFICIENT_DEPARTMENT_AGENT_POOL'
          echo 'CONDUCTOR=DISABLED_FOR_THIS_E2E'
          echo 'LIVE_NOTION=DISABLED_FOR_THIS_E2E'
          echo 'EVIDENCE_MODE=CANONICAL_PROFILE_ONLY'

      - name: Discover current jobs from configured public sources
        run: |
          python scripts/discover_jobs.py | tee discovery-run.log

      - name: Run one real job through every processing stage
        shell: bash
        run: |
          set -o pipefail
          python scripts/run_real_job_self_sufficient_e2e.py \
            --profile config/master_profile.md \
            --result-output real-job-e2e-result.json \
            --control-plane-output real-job-e2e-control-plane.json \
            --discovery-output real-job-discovery.json \
            2>&1 | tee real-job-direct-e2e.log

      - name: Assert complete E2E result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('real-job-e2e-result.json').read_text())
          required = [
              'job_verification', 'jd_analysis', 'fit', 'resume',
              'ats', 'independent_ats', 'recruiter_review', 'design_qa',
              'application_mode', 'truth_guard_passed'
          ]
          missing = [key for key in required if result.get(key) is None]
          assert not missing, missing
          assert result['job_verification']['status'] == 'ACTIVE', result['job_verification']
          assert result.get('provider_used'), result
          assert result.get('provider_policy') == 'SELF_SUFFICIENT_DEPARTMENT_AGENT_POOL_NO_CONDUCTOR', result
          assert result.get('agent_runtime', {}).get('provider_attempts'), result
          assert result.get('evidence_mode') == 'CANONICAL_PROFILE_ONLY_EXTERNAL_NOTION_DISABLED_FOR_E2E', result
          assert result['e2e_policy'] == 'REAL_DISCOVERY_FULL_PROCESSING_NO_APPLICATION_SUBMISSION'
          print('REAL_JOB_SELF_SUFFICIENT_E2E_VERIFIED')
          print('JOB=' + result['job']['company'] + ' — ' + result['job']['title'])
          print('PROVIDER=' + result['provider_used'])
          print('PROVIDER_ATTEMPTS=' + ','.join(result['agent_runtime']['provider_attempts']))
          print('FIT_SCORE=' + str(result['fit']['fit_score']))
          print('APPLICATION_MODE=' + str(result['application_mode']))
          print('APPLICATION_SUBMITTED=FALSE')
          PY

      - name: Publish complete E2E evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: career-os-real-job-e2e-${{ github.run_id }}
          path: |
            discovery-run.log
            real-job-direct-e2e.log
            real-job-discovery.json
            real-job-e2e-result.json
            real-job-e2e-control-plane.json
            jobs/discovery_runtime/**
            jobs/jd_runtime/**
            generated_resumes/**
          if-no-files-found: warn
          retention-days: 14
