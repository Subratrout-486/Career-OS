name: Career OS — Agent Harness Tests

on:
  pull_request:
    paths:
      - 'src/career_os/agent_harness.py'
      - 'tests/test_agent_harness.py'
      - 'docs/DEEPSEEK-HARNESS-ADAPTATION.md'
  push:
    branches: [deepseek-harness-hardening]

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio
      - run: python -m compileall -q src/career_os/agent_harness.py tests/test_agent_harness.py
      - run: python -m pytest tests/test_agent_harness.py -q --tb=short
