name: Career OS — Agent Harness Tests

on:
  pull_request:
    paths:
      - 'src/career_os/agent_harness.py'
      - 'src/career_os/agent_runtime.py'
      - 'src/career_os/workflow_engine.py'
      - 'src/career_os/career_workflow_handlers.py'
      - 'src/career_os/job_source_registry.py'
      - 'tests/test_agent_harness.py'
      - 'tests/test_agent_runtime_continuation.py'
      - 'tests/test_workflow_engine.py'
      - 'tests/test_career_workflow_handlers.py'
      - 'docs/DEEPSEEK-HARNESS-ADAPTATION.md'
  push:
    branches: [main]
    paths:
      - 'src/career_os/agent_harness.py'
      - 'src/career_os/agent_runtime.py'
      - 'src/career_os/workflow_engine.py'
      - 'src/career_os/career_workflow_handlers.py'
      - 'src/career_os/job_source_registry.py'
      - 'tests/test_agent_harness.py'
      - 'tests/test_agent_runtime_continuation.py'
      - 'tests/test_workflow_engine.py'
      - 'tests/test_career_workflow_handlers.py'
      - 'docs/DEEPSEEK-HARNESS-ADAPTATION.md'

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Career OS and test tools
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio
      - name: Compile harness and AgentFlow runtime
        run: python -m compileall -q src/career_os/agent_harness.py src/career_os/agent_runtime.py src/career_os/workflow_engine.py src/career_os/career_workflow_handlers.py src/career_os/job_source_registry.py tests/test_agent_harness.py tests/test_agent_runtime_continuation.py tests/test_workflow_engine.py tests/test_career_workflow_handlers.py
      - name: Run harness and AgentFlow contract tests
        run: python -m pytest tests/test_agent_harness.py tests/test_agent_runtime_continuation.py tests/test_workflow_engine.py tests/test_career_workflow_handlers.py -q --tb=short
