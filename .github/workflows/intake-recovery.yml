name: Career OS — Intake Recovery (paused)

# Recovery used to take open intake issues and run the full orchestrator.
# That is unsafe while Stage 1 is being isolated, so automatic recovery is paused.
# The file remains available for a future Stage 2 recovery implementation.

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  paused:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'INTAKE_RECOVERY_PAUSED'
          echo 'Automatic recovery is disabled until Stage 1 intake is verified.'
