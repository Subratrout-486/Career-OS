name: Career OS — Intake Recovery

on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/recover_pending_intakes.py'
      - '.github/workflows/intake-recovery.yml'
      - '.github/workflows/gmail-intake-recovery-now.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: career-os-intake-recovery
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Find pending intake issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MAX_RECOVERY_JOBS: '5'
        run: python scripts/recover_pending_intakes.py

      - name: Repair truncated orchestrator entrypoint
        if: ${{ hashFiles('recovery_paths.txt') != '' }}
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/career_os/orchestrator.py')
          text = path.read_text(encoding='utf-8')
          if text.rstrip().endswith('def main():'):
              suffix = '''
              import argparse
              parser = argparse.ArgumentParser(description="Career OS multi-agent pipeline")
              parser.add_argument("--profile", required=True)
              parser.add_argument("--job-json", required=True, help="Path to a JSON file containing title/company/location/description")
              parser.add_argument("--browser-context-json", help="Optional verified browser observations produced by the authenticated browser executor")
              parser.add_argument("--no-notion-write", action="store_true", help="Pilot/test mode: run without writing Review, Resume Library, or Application records.")
              parser.add_argument("--offline-vault", action="store_true", help="TEST ONLY: use offline evidence snapshot instead of live Notion.")
              parser.add_argument("--result-output", help="Optional path for the full pipeline result JSON.")
              parser.add_argument("--manifest-output", help="Generate a verified browser-execution manifest at this path; requires a verified browser context and all AUTO_APPLY gates.")
              parser.add_argument("--existing-application-page-id", help="Reuse an existing non-submitted Applications page during an automatic re-evaluation.")
              args = parser.parse_args()
              profile = load_profile(args.profile)
              with open(args.job_json, "r", encoding="utf-8") as f:
                  job = Job.model_validate(json.load(f))
              browser_context = None
              if args.browser_context_json:
                  with open(args.browser_context_json, "r", encoding="utf-8") as f:
                      browser_context = json.load(f)
                  if not isinstance(browser_context, dict):
                      raise SystemExit("--browser-context-json must contain a JSON object")
              vault = None
              if args.offline_vault:
                  from .evidence_vault_snapshot import VAULT_SNAPSHOT
                  vault = VAULT_SNAPSHOT
              result = asyncio.run(CareerOS(vault=vault, write_to_notion=not args.no_notion_write).process(
                  profile,
                  job,
                  browser_context=browser_context,
                  existing_application_page_id=args.existing_application_page_id,
              ))
              result_data = result.model_dump()
              if args.manifest_output:
                  try:
                      manifest = generate_browser_execution_manifest(result_data, browser_context=browser_context, output_path=args.manifest_output)
                      result_data["browser_execution_manifest"] = manifest["manifest_path"]
                  except ManifestGenerationError as exc:
                      result_data.setdefault("errors", []).append(str(exc))
                      result_data["review_status"] = "MANIFEST_GENERATION_FAILED"
              if args.result_output:
                  with open(args.result_output, "w", encoding="utf-8") as f:
                      json.dump(result_data, f, indent=2)
                      f.write("\n")
              print(json.dumps(result_data, indent=2))
          '''
              suffix = '\n'.join(line[14:] if line.startswith('              ') else line for line in suffix.splitlines()) + '\n\nif __name__ == "__main__":\n    main()\n'
              path.write_text(text + suffix, encoding='utf-8')
          compile(path.read_text(encoding='utf-8'), str(path), 'exec')
          print('orchestrator.py syntax check: PASS')
          PY

      - name: Install Career OS
        if: ${{ hashFiles('recovery_paths.txt') != '' }}
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Process pending intakes
        if: ${{ hashFiles('recovery_paths.txt') != '' }}
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'auto' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MODEL: ${{ vars.GITHUB_MODEL || 'openai/gpt-4.1-mini' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4-flash' }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_MODEL: ${{ vars.XAI_MODEL || 'grok-4.6' }}
          GROK_MODEL: ${{ vars.GROK_MODEL || 'grok-4.6' }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_REVIEW_QUEUE_PAGE_ID: ${{ secrets.NOTION_REVIEW_QUEUE_PAGE_ID }}
          NOTION_RESUME_LIBRARY_DATA_SOURCE_ID: ${{ vars.NOTION_RESUME_LIBRARY_DATA_SOURCE_ID || '3ac8bc1d-ce0e-8051-a553-000bb5f58abe' }}
          NOTION_EVIDENCE_VAULT_DATA_SOURCE_ID: ${{ vars.NOTION_EVIDENCE_VAULT_DATA_SOURCE_ID || 'eb8a5be7-990e-47d3-9b36-c922ff0bb3aa' }}
          NOTION_APPLICATIONS_DATA_SOURCE_ID: ${{ vars.NOTION_APPLICATIONS_DATA_SOURCE_ID || 'a6925702-0d2a-4d68-919b-3401e1d8ff75' }}
          NOTION_VERSION: ${{ vars.NOTION_VERSION || '2026-03-11' }}
        run: |
          set -euo pipefail
          while IFS= read -r job_path; do
            [ -z "$job_path" ] && continue
            echo "=== Recovering $job_path ==="
            python -m career_os.orchestrator --profile config/master_profile.md --job-json "$job_path"
          done < recovery_paths.txt
