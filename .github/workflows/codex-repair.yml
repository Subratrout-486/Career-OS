name: Career OS — Codex Repair

# Bounded Codex repair. It is dispatched only by agent-failure-handoff.
# Codex inspects and edits an isolated checkout; a fresh follow-up job validates,
# pushes, and opens the human-approval PR. No merge is automatic.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Original failed workflow run ID
        required: true
        type: string
      workflow_name:
        description: Original failed workflow name
        required: true
        type: string
      head_sha:
        description: Failed workflow head SHA
        required: true
        type: string
      run_url:
        description: Original failed workflow URL
        required: true
        type: string
      attempt:
        description: Repair attempt number (1-3)
        required: true
        default: "1"
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: career-os-codex-repair-${{ inputs.run_id }}-${{ inputs.attempt }}
  cancel-in-progress: false

jobs:
  repair:
    if: ${{ fromJSON(inputs.attempt) >= 1 && fromJSON(inputs.attempt) <= 3 }}
    runs-on: ubuntu-latest
    outputs:
      repair_bundle: ${{ steps.codex.outputs.final-message }}
      branch_name: ${{ steps.branch.outputs.name }}
      credential_guard: ${{ steps.credential_guard.outcome }}
      branch_guard: ${{ steps.branch_guard.outputs.skip }}
    steps:
      - name: Guard — verify API credential is configured
        id: credential_guard
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is not configured as a GitHub Actions secret." >&2
            exit 78
          fi

      - name: Guard — prevent duplicate attempt branch
        id: branch_guard
        if: steps.credential_guard.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.run_id }}
          ATTEMPT: ${{ inputs.attempt }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          BRANCH="codex/repair/${RUN_ID}/attempt-${ATTEMPT}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --heads "https://github.com/${REPOSITORY}.git" "$BRANCH" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Repair branch already exists for this attempt; refusing duplicate execution."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Export branch name
        id: branch
        if: steps.branch_guard.outputs.skip != 'true'
        env:
          RUN_ID: ${{ inputs.run_id }}
          ATTEMPT: ${{ inputs.attempt }}
        run: echo "name=codex/repair/${RUN_ID}/attempt-${ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Checkout failed commit in isolated workspace
        if: steps.branch_guard.outputs.skip != 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Create isolated repair branch
        if: steps.branch_guard.outputs.skip != 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail
          git switch -c "$BRANCH"

      - name: Fetch failure diagnostics
        if: steps.branch_guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh run view "$RUN_ID" --repo "$REPOSITORY" --log-failed > /tmp/failure.log 2>&1 || true
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('/tmp/failure.log').read_text(errors='replace')
          patterns = [
              r'(?i)(openai[_-]?api[_-]?key|api[_-]?key|token|secret|password|client[_-]?secret|refresh[_-]?token)\s*[:=]\s*[^\s]+',
              r'(?i)authorization:\s*bearer\s+[^\s]+',
          ]
          for pattern in patterns:
              text = re.sub(pattern, '[REDACTED]', text)
          Path('/tmp/failure-redacted.log').write_text(text[-40000:], encoding='utf-8')
          PY

      - name: Run Codex repair agent
        if: steps.branch_guard.outputs.skip != 'true'
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          safety-strategy: drop-sudo
          allow-bot-users: github-actions[bot]
          model: ${{ vars.CODEX_MODEL || 'gpt-5.5' }}
          output-schema: |
            {
              "type": "object",
              "properties": {
                "patch": { "type": "string" },
                "summary": { "type": "string" },
                "tests": { "type": "string" }
              },
              "required": ["patch", "summary", "tests"],
              "additionalProperties": false
            }
          prompt: |
            You are the Career OS bounded repair engineer.

            Original failed workflow: ${{ inputs.workflow_name }}
            Original run: ${{ inputs.run_url }}
            Original run ID: ${{ inputs.run_id }}
            Failed head SHA: ${{ inputs.head_sha }}
            Repair attempt: ${{ inputs.attempt }} of 3

            Work ONLY in this checkout and repair ONLY the original failure. Do not redesign the system.
            Diagnose from the repository and the redacted failure log at /tmp/failure-redacted.log.
            Make the smallest safe fix and run the relevant tests.

            HARD SAFETY RULES:
            - Never modify main; this checkout is an isolated codex/repair/* branch.
            - Never modify or weaken Truth Guard, Application Mode, browser preflight/safety,
              Manus execution/reconciliation, evidence/provenance, or credential handling.
            - Never modify .env, secrets, credentials, master profile claims, evidence vault snapshots,
              or any secret-bearing configuration.
            - Never fabricate career evidence.
            - Never submit a job application.
            - Never weaken the existing human approval gate.
            - Do not edit .github/workflows/agent-failure-handoff.yml or .github/workflows/self-heal.yml.
            - Do not edit .github/workflows/codex-repair.yml.
            - Do not add new credentials or API keys.
            - Do not bypass tests or suppress failures.
            - Keep changes limited to the smallest files required for the observed failure.
            - Do not install system packages or use sudo.

            The first validation target is the known Gmail Job Intake failure:
            ModuleNotFoundError: No module named 'scripts'
            A claimed fix exists in commit 15c3f9f, but trust the checked-out repository state and do not
            recreate that fix if it is already present.

            Run the relevant tests and deterministic tests before finishing. Inspect git diff and ensure
            only intended files changed.

            IMPORTANT OUTPUT CONTRACT:
            - Do NOT include secrets, credentials, tokens, failure logs, or environment values in your final response.
            - Your final response MUST be the JSON object required by the output schema.
            - The `patch` field MUST contain the complete `git diff --binary` for the repair from the
              original failed head SHA to the current working tree.
            - The patch must apply cleanly to the original failed head SHA.
            - The `summary` field must state the root cause and exact repair.
            - The `tests` field must list the commands you actually ran and their outcomes.
            - Do not commit or push; a separate fresh job will validate, commit, push, and create the PR.

  validate-and-publish:
    needs: repair
    if: ${{ needs.repair.result == 'success' && needs.repair.branch_guard != 'true' && needs.repair.credential_guard == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout failed commit into a fresh runner
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Materialize Codex repair patch
        env:
          REPAIR_BUNDLE: ${{ needs.repair.outputs.repair_bundle }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys
          bundle = json.loads(os.environ['REPAIR_BUNDLE'])
          patch = bundle.get('patch', '')
          if not patch or len(patch) > 800000:
              raise SystemExit('Codex repair patch missing or exceeds safe output size limit')
          with open('/tmp/codex-repair.patch', 'w', encoding='utf-8') as f:
              f.write(patch)
          with open('/tmp/codex-repair-summary.md', 'w', encoding='utf-8') as f:
              f.write('## Codex summary\n\n' + bundle.get('summary', '') + '\n\n## Codex tests\n\n' + bundle.get('tests', ''))
          PY
          git apply --check --binary /tmp/codex-repair.patch
          git apply --binary /tmp/codex-repair.patch

      - name: Enforce automatic-repair path restrictions
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          changed = subprocess.check_output(['git', 'status', '--porcelain'], text=True).splitlines()
          paths = []
          for line in changed:
              path = line[3:].strip()
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              paths.append(path.replace('\\', '/'))
          allowed_prefixes = ('src/career_os/', 'scripts/', 'tests/', 'docs/')
          forbidden = {
              '.github/workflows/agent-failure-handoff.yml',
              '.github/workflows/self-heal.yml',
              '.github/workflows/codex-repair.yml',
              'config/master_profile.md',
              '.env',
              '.env.example',
          }
          bad = []
          for path in paths:
              if path in forbidden or not any(path.startswith(p) for p in allowed_prefixes):
                  bad.append(path)
              if any(token in path.lower() for token in ('secret', 'credential')):
                  bad.append(path)
          if bad:
              raise SystemExit('Unsafe automatic repair paths: ' + ', '.join(sorted(set(bad))))
          print('Automatic-repair path guard passed:', paths or '(no changes)')
          PY

      - name: Run compile and deterministic tests
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio httpx
          python -m compileall -q src scripts
          python -m pytest tests/ -q --tb=short

      - name: Commit isolated repair branch
        env:
          BRANCH: ${{ needs.repair.outputs.branch_name }}
        run: |
          set -euo pipefail
          git switch -c "$BRANCH"
          git config user.name "Career OS Codex Repair"
          git config user.email "career-os-codex-repair@users.noreply.github.com"
          git add -A
          git commit -m "fix: Codex repair for workflow run ${{ inputs.run_id }} (attempt ${{ inputs.attempt }})"

      - name: Push isolated repair branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git push origin HEAD

      - name: Create human-approval PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
          RUN_URL: ${{ inputs.run_url }}
          WORKFLOW: ${{ inputs.workflow_name }}
          ATTEMPT: ${{ inputs.attempt }}
          BRANCH: ${{ needs.repair.outputs.branch_name }}
        run: |
          set -euo pipefail
          gh pr create \
            --repo "$REPOSITORY" \
            --base main \
            --head "$BRANCH" \
            --title "[Codex repair] ${WORKFLOW} — run ${RUN_ID}" \
            --body-file /tmp/codex-repair-summary.md

  retry:
    needs: repair
    if: ${{ needs.repair.result == 'failure' && needs.repair.credential_guard == 'success' && needs.repair.branch_guard != 'true' && fromJSON(inputs.attempt) < 3 }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch next bounded repair attempt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ATTEMPT: ${{ inputs.attempt }}
          RUN_ID: ${{ inputs.run_id }}
          WORKFLOW: ${{ inputs.workflow_name }}
          HEAD_SHA: ${{ inputs.head_sha }}
          RUN_URL: ${{ inputs.run_url }}
        run: |
          set -euo pipefail
          NEXT=$((ATTEMPT + 1))
          gh workflow run codex-repair.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f run_id="$RUN_ID" \
            -f workflow_name="$WORKFLOW" \
            -f head_sha="$HEAD_SHA" \
            -f run_url="$RUN_URL" \
            -f attempt="$NEXT"

  missing-credential:
    needs: repair
    if: ${{ needs.repair.result == 'failure' && needs.repair.credential_guard == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Report missing credential configuration
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          gh issue create --repo "$REPOSITORY" \
            --title "[codex-repair] missing OPENAI_API_KEY for run $RUN_ID" \
            --body "Automatic Codex repair was not started. Required GitHub Actions secret by name: OPENAI_API_KEY. No API key value was exposed."
