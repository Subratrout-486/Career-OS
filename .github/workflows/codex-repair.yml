name: Career OS — Codex Repair

# Bounded Codex repair. It is dispatched only by agent-failure-handoff.
# Codex works from the failed commit on an isolated branch. No merge is automatic.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Original failed workflow run ID
        required: true
        type: string
      workflow_name:
        description: Original failed workflow name
        required: true
        type: string
      head_sha:
        description: Failed workflow head SHA
        required: true
        type: string
      run_url:
        description: Original failed workflow URL
        required: true
        type: string
      attempt:
        description: Repair attempt number (1-3)
        required: true
        default: "1"
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: career-os-codex-repair-${{ inputs.run_id }}-${{ inputs.attempt }}
  cancel-in-progress: false

jobs:
  repair:
    if: ${{ fromJSON(inputs.attempt) >= 1 && fromJSON(inputs.attempt) <= 3 }}
    runs-on: ubuntu-latest
    steps:
      - name: Guard — verify API credential is configured
        id: credential_guard
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is not configured as a GitHub Actions secret." >&2
            exit 78
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Guard — prevent duplicate attempt branch
        id: branch_guard
        if: steps.credential_guard.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.run_id }}
          ATTEMPT: ${{ inputs.attempt }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          BRANCH="codex/repair/${RUN_ID}/attempt-${ATTEMPT}"
          if git ls-remote --exit-code --heads "https://github.com/${REPOSITORY}.git" "$BRANCH" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Repair branch already exists for this attempt; refusing duplicate execution."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout failed commit in isolated branch
        if: steps.branch_guard.outputs.skip != 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Create isolated repair branch
        if: steps.branch_guard.outputs.skip != 'true'
        env:
          RUN_ID: ${{ inputs.run_id }}
          ATTEMPT: ${{ inputs.attempt }}
        run: |
          set -euo pipefail
          git switch -c "codex/repair/${RUN_ID}/attempt-${ATTEMPT}"

      - name: Fetch failure diagnostics
        if: steps.branch_guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh run view "$RUN_ID" --repo "$REPOSITORY" --log-failed > /tmp/failure.log 2>&1 || true
          # Never pass raw credentials or environment dumps to Codex.
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('/tmp/failure.log').read_text(errors='replace')
          patterns = [
              r'(?i)(openai[_-]?api[_-]?key|api[_-]?key|token|secret|password|client[_-]?secret|refresh[_-]?token)\s*[:=]\s*[^\s]+',
              r'(?i)authorization:\s*bearer\s+[^\s]+',
          ]
          for pattern in patterns:
              text = re.sub(pattern, lambda m: '[REDACTED]', text)
          Path('/tmp/failure-redacted.log').write_text(text[-40000:], encoding='utf-8')
          PY

      - name: Prepare isolated git credentials for Codex
        if: steps.branch_guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "Career OS Codex Repair"
          git config user.email "career-os-codex-repair@users.noreply.github.com"
          gh auth setup-git

      - name: Run Codex repair agent
        if: steps.branch_guard.outputs.skip != 'true'
        id: codex
        uses: openai/codex-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          safety-strategy: drop-sudo
          allow-bot-users: github-actions[bot]
          model: ${{ vars.CODEX_MODEL || 'gpt-5.5' }}
          prompt: |
            You are the Career OS bounded repair engineer.

            Original failed workflow: ${{ inputs.workflow_name }}
            Original run: ${{ inputs.run_url }}
            Original run ID: ${{ inputs.run_id }}
            Failed head SHA: ${{ inputs.head_sha }}
            Repair attempt: ${{ inputs.attempt }} of 3

            Work ONLY in this checkout and repair ONLY the original failure. Do not redesign the system.
            Diagnose from the repository and the redacted failure log at /tmp/failure-redacted.log.
            Make the smallest safe fix and run the relevant tests.

            HARD SAFETY RULES:
            - Never modify main; this checkout is an isolated codex/repair/* branch.
            - Never modify or weaken Truth Guard, Application Mode, browser preflight/safety,
              Manus execution/reconciliation, evidence/provenance, or credential handling.
            - Never modify .env, secrets, credentials, master profile claims, evidence vault snapshots,
              or any secret-bearing configuration.
            - Never fabricate career evidence.
            - Never submit a job application.
            - Never weaken the existing human approval gate.
            - Do not edit .github/workflows/agent-failure-handoff.yml or .github/workflows/self-heal.yml.
            - Do not add new credentials or API keys.
            - Do not bypass tests or suppress failures.
            - Keep changes limited to the smallest files required for the observed failure.
            - Do not install system packages or use sudo.

            The first validation target is the known Gmail Job Intake failure:
            ModuleNotFoundError: No module named 'scripts'
            A claimed fix exists in commit 15c3f9f, but trust the checked-out repository state and do not
            recreate that fix if it is already present.

            Before finishing:
            1. Run git diff --name-only and verify every changed path is allowed.
            2. Run python -m compileall -q src scripts.
            3. Run python -m pytest tests/ -q --tb=short.
            4. Do not modify protected paths.
            5. Commit the smallest repair to the current codex/repair/* branch.
            6. Push that branch using the existing GH_TOKEN credentials.
            7. Create a PR to main describing the original failed workflow, root cause, exact change,
               tests passed, and the fact that human approval is required.
            8. Never merge the PR.

            The action is the final step of the repair job. Do not attempt to run commands after this task.

      - name: Enforce automatic-repair path restrictions
        if: steps.branch_guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          rm -rf .git/hooks
          git config --local core.hooksPath /dev/null
          python - <<'PY'
          import subprocess
          changed = subprocess.check_output(['git', 'status', '--porcelain'], text=True).splitlines()
          paths = []
          for line in changed:
              path = line[3:].strip()
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              paths.append(path.replace('\\', '/'))
          allowed_prefixes = ('src/career_os/', 'scripts/', 'tests/', 'docs/')
          forbidden = {
              '.github/workflows/agent-failure-handoff.yml',
              '.github/workflows/self-heal.yml',
              '.github/workflows/codex-repair.yml',
              'config/master_profile.md',
              '.env',
              '.env.example',
          }
          bad = []
          for path in paths:
              if path in forbidden or not any(path.startswith(p) for p in allowed_prefixes):
                  bad.append(path)
              if any(token in path.lower() for token in ('secret', 'credential')):
                  bad.append(path)
          if bad:
              raise SystemExit('Unsafe automatic repair paths: ' + ', '.join(sorted(set(bad))))
          print('Automatic-repair path guard passed:', paths or '(no changes)')
          PY

      - name: Install test dependencies
        if: steps.branch_guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio httpx

      - name: Run relevant and deterministic tests
        if: steps.branch_guard.outputs.skip != 'true'
        id: tests
        run: |
          set -euo pipefail
          python -m compileall -q src scripts
          python -m pytest tests/ -q --tb=short
          echo "passed=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch next bounded repair attempt after failure
        if: failure() && steps.credential_guard.outcome == 'success' && steps.branch_guard.outputs.skip != 'true' && fromJSON(inputs.attempt) < 3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ATTEMPT: ${{ inputs.attempt }}
          RUN_ID: ${{ inputs.run_id }}
          WORKFLOW: ${{ inputs.workflow_name }}
          HEAD_SHA: ${{ inputs.head_sha }}
          RUN_URL: ${{ inputs.run_url }}
        run: |
          set -euo pipefail
          NEXT=$((ATTEMPT + 1))
          gh workflow run codex-repair.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f run_id="$RUN_ID" \
            -f workflow_name="$WORKFLOW" \
            -f head_sha="$HEAD_SHA" \
            -f run_url="$RUN_URL" \
            -f attempt="$NEXT"

      - name: Report missing credential configuration
        if: failure() && steps.credential_guard.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          gh issue create --repo "$REPOSITORY" \
            --title "[codex-repair] missing OPENAI_API_KEY for run $RUN_ID" \
            --body "Automatic Codex repair was not started. Required GitHub Actions secret by name: OPENAI_API_KEY. No API key value was exposed."
