name: Career OS — Real E2E Trigger (Self-Sufficient)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  PYTHONUNBUFFERED: '1'
  PYTHONFAULTHANDLER: '1'
  DISCOVERY_DAYS: '45'
  MAX_NEW_JOBS: '50'
  CAREER_SOURCE_BATCH_SIZE: '8'
  ATS_INDEPENDENT_PASS_THRESHOLD: '60'
  # Conductor is intentionally NOT part of the normal real-job E2E path.
  # It remains available as a separate integration path when explicitly configured.
  AI_PROVIDER: pool
  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
  DEEPSEEK_MODEL: deepseek-chat
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GEMINI_MODEL: gemini-3.1-flash-lite
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  ANTHROPIC_MODEL: claude-sonnet-4-20250514
  XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
  XAI_MODEL: grok-4-1-fast-reasoning
  OPENAI_API_KEY: ${{ secrets.MANUS_API_KEY }}
  OPENAI_API_BASE: ${{ secrets.MANUS_API_BASE }}
  GH_TOKEN: ${{ github.token }}
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio httpx pyyaml

      - name: Contract tests
        run: |
          python -m pytest -q \
            tests/test_agent_harness.py \
            tests/test_agent_runtime_continuation.py \
            tests/test_pipeline_harness.py \
            tests/test_jd_enrichment_stage.py \
            tests/test_direct_provider_runtime.py \
            tests/test_direct_provider_runtime_pool_regression.py \
            tests/test_provider_fallback_regression.py

      - name: Verify self-sufficient provider pool
        run: |
          configured=0
          test -n "$DEEPSEEK_API_KEY" && configured=$((configured+1)) && echo 'DEEPSEEK=CONFIGURED'
          test -n "$GEMINI_API_KEY" && configured=$((configured+1)) && echo 'GEMINI=CONFIGURED'
          test -n "$ANTHROPIC_API_KEY" && configured=$((configured+1)) && echo 'ANTHROPIC=CONFIGURED'
          test -n "$XAI_API_KEY" && configured=$((configured+1)) && echo 'XAI=CONFIGURED'
          if test -n "$OPENAI_API_KEY" && test -n "$OPENAI_API_BASE"; then
            configured=$((configured+1))
            echo 'MANUS=CONFIGURED'
          fi
          test "$configured" -ge 1
          echo 'AGENT_RUNTIME=SELF_SUFFICIENT_DEPARTMENT_AGENT_POOL'
          echo 'CONDUCTOR=DISABLED_FOR_THIS_E2E'

      - name: Discover and persist current jobs
        run: python scripts/discover_jobs.py | tee discovery-run.log

      - name: Process one real discovered job through full self-sufficient pipeline
        shell: bash
        run: |
          set -o pipefail
          python scripts/run_real_job_self_sufficient_e2e.py \
            --profile config/master_profile.md \
            --result-output real-job-e2e-result.json \
            --control-plane-output real-job-e2e-control-plane.json \
            --discovery-output real-job-discovery.json \
            2>&1 | tee real-job-direct-e2e.log

      - name: Verify every processing stage completed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('real-job-e2e-result.json').read_text())
          required=['job_verification','jd_analysis','fit','resume','ats','independent_ats','recruiter_review','design_qa','salary','application_mode']
          missing=[x for x in required if r.get(x) is None]
          assert not missing, missing
          assert r['job_verification']['status']=='ACTIVE', r['job_verification']
          assert r.get('provider_used'), r
          assert r.get('provider_policy') == 'SELF_SUFFICIENT_DEPARTMENT_AGENT_POOL_NO_CONDUCTOR', r
          assert r.get('agent_runtime', {}).get('provider_attempts'), r
          assert r['application_mode'] in {'AUTO_APPLY','REVIEW_REQUIRED','DO_NOT_APPLY'}
          assert r.get('e2e_policy') == 'REAL_DISCOVERY_FULL_PROCESSING_NO_APPLICATION_SUBMISSION', r
          print('CAREER_OS_FULL_E2E_VERIFIED')
          print('JOB=',r['job']['company'],'—',r['job']['title'])
          print('PROVIDER=',r['provider_used'])
          print('FIT_SCORE=',r['fit']['fit_score'])
          print('RECRUITER_REVIEW=',r['recruiter_review']['status'])
          print('APPLICATION_MODE=',r['application_mode'])
          print('APPLICATION_SUBMITTED=FALSE')
          PY

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: career-os-real-e2e-${{ github.run_id }}
          path: |
            discovery-run.log
            real-job-direct-e2e.log
            real-job-discovery.json
            real-job-e2e-result.json
            real-job-e2e-control-plane.json
            jobs/discovery_runtime/**
            jobs/jd_runtime/**
            generated_resumes/**
          if-no-files-found: warn
          retention-days: 14
