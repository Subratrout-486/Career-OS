name: Career OS — Dashboard Sync

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dashboard/sync_notion.py'
      - '.github/workflows/dashboard-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install sync dependency
        run: pip install httpx
      - name: Sync Notion to dashboard snapshot
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_JOBS_DATA_SOURCE_ID: ${{ vars.NOTION_JOBS_DATA_SOURCE_ID || '3ab8bc1d-ce0e-808c-93c3-000b43141dec' }}
          NOTION_VERSION: ${{ vars.NOTION_VERSION || '2026-03-11' }}
          NOTION_APPLICATIONS_DATA_SOURCE_ID: ${{ vars.NOTION_APPLICATIONS_DATA_SOURCE_ID || 'a6925702-0d2a-4d68-919b-3401e1d8ff75' }}
          NOTION_RESUME_LIBRARY_DATA_SOURCE_ID: ${{ vars.NOTION_RESUME_LIBRARY_DATA_SOURCE_ID || '3ac8bc1d-ce0e-8051-a553-000bb5f58abe' }}
          CAREER_OS_EXECUTION_ENABLED: ${{ vars.CAREER_OS_EXECUTION_ENABLED || 'false' }}
        run: python dashboard/sync_notion.py
      - name: Commit dashboard snapshot
        run: |
          git config user.name 'career-os-dashboard[bot]'
          git config user.email 'career-os-dashboard[bot]@users.noreply.github.com'
          git add dashboard/data.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore: sync Career OS dashboard data'
          git push
