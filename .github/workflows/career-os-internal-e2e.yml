name: Career OS — Internal Runtime Real Job E2E

on:
  workflow_dispatch:
  push:
    branches: [career-os-self-healing-coding-agent-v2]
    paths:
      - 'scripts/run_real_job_internal_e2e.py'
      - 'src/career_os/job_e2e_runner.py'
      - '.github/workflows/career-os-internal-e2e.yml'

permissions:
  contents: read
  issues: write

env:
  PYTHONUNBUFFERED: '1'
  AI_PROVIDER: auto
  DISCOVERY_DAYS: '45'
  MAX_NEW_JOBS: '5'
  ATS_INDEPENDENT_PASS_THRESHOLD: '60'
  APPLICATION_SUBMISSION_ENABLED: 'false'

jobs:
  internal-real-job-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Career OS
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio httpx pyyaml
      - name: Contract tests
        run: |
          python -m pytest -q tests/test_agent_harness.py tests/test_agent_runtime_continuation.py tests/test_pipeline_harness.py tests/test_jd_enrichment_stage.py
      - name: Run one real job on internal runtime
        run: |
          python scripts/run_real_job_internal_e2e.py --profile config/master_profile.md --result-output real-job-internal-e2e-result.json --control-plane-output real-job-internal-e2e-control-plane.json
      - name: Assert terminal evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('real-job-internal-e2e-result.json').read_text())
          assert r.get('state') in {'READY_TO_APPLY','REVIEW_REQUIRED','BLOCKED'}, r
          assert r.get('submission',{}).get('performed') is False, r
          assert r.get('run_id'), r
          print('INTERNAL_REAL_JOB_E2E_VERIFIED')
          print('JOB='+str(r.get('job',{}).get('company'))+' — '+str(r.get('job',{}).get('title')))
          print('STATE='+str(r.get('state')))
          print('APPLICATION_SUBMITTED=FALSE')
          PY
      - name: Publish E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: career-os-internal-e2e-${{ github.run_id }}
          path: |
            real-job-internal-e2e-result.json
            real-job-internal-e2e-control-plane.json
            jobs/discovery_runtime/**
            generated_resumes/**
          if-no-files-found: warn
          retention-days: 14
